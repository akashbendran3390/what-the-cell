<script>
window.JOURNEY = {
  title: 'Journey Up a Plant',
  sub: 'DP Biology B3.2 (plants) · simplified, not to scale',
  startTitle: 'From the soil to the air',
  intro: 'Ride with a water molecule from the soil into a root hair, across the root, up a xylem vessel through the stem and out of a leaf by transpiration. At HL you also see root pressure and sugar moving down in the phloem.',
  note: 'Blue dots: water. Yellow dots: sucrose in the phloem. The xylem is shown much wider than it really is.',
  rideLabel: 'Ride with water',
  theme: { bg: '#0f170d', panel: 'rgba(18,28,14,.86)', accent: '#9ad7ff', dim: '#c6d4bf', line: 'rgba(200,235,190,.22)' },
  fog: 0.004,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const soil = new THREE.Mesh(new THREE.BoxGeometry(200, 60, 80), T(0x6b4423, 0.45)); soil.position.y = -60; scene.add(soil);
    // Stem with xylem vessels (with lignin rings) and phloem tubes
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(9, 10, 120, 32, 1, true), T(0x6a994e, 0.25)); stem.position.y = 0; scene.add(stem);
    const xyl = [], phl = [];
    [[-3, 0], [0, -3], [3, 0]].forEach(([x, z]) => { const v = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 150, 16, 1, true), T(0x9ad7ff, 0.3)); v.position.set(x, -15, z); scene.add(v); xyl.push(v);
      for (let y = -88; y < 60; y += 2.2) { const r = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.18, 6, 16), M(0x8d6e63)); r.rotation.x = Math.PI / 2; r.position.set(x, y, z); scene.add(r); } });
    [[5.5, 3], [-5.5, 3]].forEach(([x, z]) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 150, 12, 1, true), T(0xffd166, 0.3)); p.position.set(x, -15, z); scene.add(p); phl.push(p);
      for (let y = -88; y < 60; y += 8) { const sp = new THREE.Mesh(new THREE.CircleGeometry(1.1, 12), M(0xd4a017, { side: THREE.DoubleSide, transparent: true, opacity: 0.6 })); sp.rotation.x = Math.PI / 2; sp.position.set(x, y, z); scene.add(sp); } });
    // Roots with root hairs
    const rootM = M(0xe9d8a6);
    [[-30, -80, 6], [28, -82, -6], [0, -95, 0], [-18, -96, -10]].forEach(([x, y, z]) => { scene.add(tube([V(0, -60, 0), V(x * 0.5, (y - 60) / 2 - 10, z * 0.5), V(x, y, z)], 2.4, rootM, 30));
      for (let i = 0; i < 40; i++) { const t = i / 40, p = V(x * t * 0.9, -60 + (y + 60) * t, z * t * 0.9); const h = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4, 4), rootM); h.position.copy(p).add(A.onSphere(2.6)); h.lookAt(p); h.rotateX(Math.PI / 2); scene.add(h); } });
    // Leaf at the top with a vein and stomata
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), M(0x52b788, { transparent: true, opacity: 0.75 })); leaf.scale.set(40, 2.5, 18); leaf.position.set(38, 64, 0); leaf.rotation.z = 0.15; scene.add(leaf);
    scene.add(tube([V(0, 58, 0), V(18, 62, 0), V(60, 68, 0)], 1.2, T(0x9ad7ff, 0.5), 30));
    for (let i = 0; i < 8; i++) { const s = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.35, 6, 12), M(0x2d6a4f)); s.rotation.x = Math.PI / 2; s.position.set(24 + i * 4.5, 61.5 + i * 0.5, A.rnd(-6, 6)); scene.add(s); }
    const fruit = new THREE.Mesh(new THREE.SphereGeometry(6, 20, 16), M(0xe63946)); fruit.position.set(-26, 40, 0); scene.add(fruit); scene.add(tube([V(-5.5, 36, 3), V(-14, 40, 2), V(-22, 40, 0)], 0.8, T(0xffd166, 0.5), 20));
    A.label('Soil water', V(-40, -58, 20), 400); A.label('Root hair', V(-24, -78, 8)); A.label('Xylem vessel', V(0, -20, 4)); A.label('Lignin rings', V(-4, 10, 3)); A.label('Phloem (sieve tubes)', V(9, 20, 4)); A.label('Leaf', V(50, 70, 0), 400); A.label('Stomata', V(30, 58, 6)); A.label('Fruit (a sink)', V(-26, 48, 0));
    // Particles: water rising in xylem, sucrose moving down and to the fruit in phloem
    const water = []; const wPath = new THREE.CatmullRomCurve3([V(-34, -80, 8), V(-26, -78, 7), V(-12, -68, 3), V(0, -58, 0), V(0, 0, 0), V(0, 56, 0), V(18, 62, 0), V(30, 63, 2), V(34, 70, 4)]);
    for (let i = 0; i < 90; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 4), M(0x4fb3ff, { emissive: 0x0a2a55 })); scene.add(m); water.push({ m, u: Math.random(), o: A.onSphere(A.rnd(0, 1.2)) }); }
    const sug = []; const sPath = new THREE.CatmullRomCurve3([V(30, 62, 0), V(10, 58, 2), V(5.5, 40, 3), V(5.5, 0, 3), V(5.5, -50, 3), V(10, -70, 0)]);
    for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), M(0xffd166)); scene.add(m); sug.push({ m, u: Math.random(), o: A.onSphere(A.rnd(0, 0.6)) }); }
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 8), M(0x4fb3ff, { emissive: 0x114477 })); scene.add(hero);
    return {
      route: [V(-40, -82, 10), V(-26, -78, 7), V(-12, -68, 3), V(0, -58, 0), V(0, -20, 0), V(0, 30, 0), V(0, 56, 0), V(18, 62, 0), V(30, 63, 2), V(34, 72, 6)], hero, camOffset: V(6, 3, 12), outside: { target: V(0, -5, 0), dist: 210 },
      outsideInfo: { n: 'Transport in a plant', s: 'Water and mineral ions travel up from the roots in the xylem. Sugars made in the leaves travel in the phloem to wherever they are needed.', h: 'Xylem flow is one way, from roots to leaves, and needs no energy from the plant. Phloem flow can go up or down, from sources to sinks, and needs active loading of sucrose.', cs: 'B3.2.7', ch: 'B3.2.18' },
      stops: [
        { at: V(-26, -78, 7), look: V(-30, -80, 6), n: 'Root hairs', s: 'Root hairs give a large surface area for taking in water. Water enters by osmosis because the root cells have a lower water potential than the soil water.', h: 'Root cells actively take up mineral ions, which lowers their water potential and keeps water flowing in.', cs: 'B3.2.7', ch: 'B3.2.17' },
        { at: V(0, -58, 0), n: 'Into the xylem', s: 'Water crosses the root cortex to the xylem in the centre of the root.', h: 'Ions pumped into the xylem draw water in by osmosis. This creates root pressure, which can push water up even when transpiration is low, for example at night or in spring before leaves open.', cs: 'B3.2.10', ch: 'B3.2.17' },
        { at: V(0, -20, 0), look: V(-3, -10, 0), n: 'Up the xylem vessel', s: 'Xylem vessels are long, hollow tubes of dead cells with no end walls. Rings of lignin stop them collapsing under tension.', h: 'Water is pulled up as a continuous column: cohesion between water molecules (hydrogen bonds) and adhesion to the vessel walls let the tension pass all the way down from the leaves.', cs: 'B3.2.8', ch: 'B3.2.7' },
        { at: V(0, 30, 0), look: V(5.5, 30, 3), n: 'Phloem alongside', s: 'Next to the xylem are phloem sieve tubes, which carry sugar from the leaves to other parts of the plant.', h: 'Sucrose is actively loaded into sieve tubes at a source (the leaf). Water follows by osmosis, building pressure that pushes the sap to a sink, such as a fruit or root, where sucrose is unloaded.', cs: 'B3.2.9', ch: 'B3.2.18' },
        { at: V(30, 63, 2), n: 'Transpiration', s: 'In the leaf, water evaporates from cell surfaces into the air spaces and diffuses out through the stomata. This loss of water vapour is transpiration, and it pulls more water up the xylem.', h: 'Transpiration is a consequence of gas exchange: the stomata must open to let carbon dioxide in, so water vapour escapes.', cs: 'B3.2.7', ch: 'B3.1.9' }
      ],
      update(dt, A) { const run = A.paused ? 0 : dt;
        water.forEach(w => { w.u = (w.u + run * 0.04) % 1; w.m.position.copy(wPath.getPointAt(w.u)).add(w.o); });
        sug.forEach(s => { s.u = (s.u + run * 0.035) % 1; s.m.position.copy(sPath.getPointAt(s.u)).add(s.o); }); }
    };
  }
};
