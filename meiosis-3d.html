<script>
window.JOURNEY = {
  title: 'Meiosis in 3D',
  sub: 'DP Biology D2.1 · simplified, not to scale',
  startTitle: 'One cell becomes four',
  intro: 'Watch a cell with two pairs of homologous chromosomes go through both divisions of meiosis. See homologues pair up and cross over, separate in meiosis I, then sister chromatids separate in meiosis II to give four haploid cells that are all different.',
  note: 'Red and pink: one homologous pair (long). Blue and light blue: a second pair (short). A tip in the other colour shows where crossing over swapped a section. White: centromeres. Green lines: spindle microtubules.',
  rideLabel: 'Step through meiosis',
  theme: { bg: '#120f1a', panel: 'rgba(24,18,34,.86)', accent: '#c3a6ff', dim: '#d2c8e2', line: 'rgba(210,190,250,.22)' },
  fog: 0.005,
  build(A) {

    let bar = null; function getBar() { if (bar) return bar; const b = document.getElementById('mx-bar'); if (!b) return null; NAMES.forEach(() => { const d = document.createElement('span'); d.style.cssText = 'flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2)'; b.appendChild(d); }); return bar = b; }
    const cell = new THREE.Mesh(new THREE.SphereGeometry(15, 40, 28), T(0xc3a6ff, 0.12)); scene.add(cell);
    const two = [-1, 1].map(h => { const d = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 24), T(0xc3a6ff, 0.12)); d.position.x = h * 10; scene.add(d); return d; });
    const four = []; [-1, 1].forEach(h => [-1, 1].forEach(v => { const d = new THREE.Mesh(new THREE.SphereGeometry(6.5, 28, 20), T(0xc3a6ff, 0.14)); d.position.set(h * 10, v * 7, 0); scene.add(d); four.push(d); }));
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(15, 0.5, 8, 48), M(0x9d4edd, { transparent: true })); ring1.rotation.y = Math.PI / 2; scene.add(ring1);
    const ring2 = [-1, 1].map(h => { const r = new THREE.Mesh(new THREE.TorusGeometry(10, 0.4, 8, 40), M(0x9d4edd, { transparent: true })); r.rotation.x = Math.PI / 2; r.position.x = h * 10; scene.add(r); return r; });
    const nuc = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 24), T(0xe0d4ff, 0.3)); scene.add(nuc);
    const nucs4 = four.map(f => { const n = new THREE.Mesh(new THREE.SphereGeometry(3, 20, 14), T(0xe0d4ff, 0.3)); n.position.copy(f.position); scene.add(n); return n; });
    const cols = [0xe63946, 0xff8fab, 0x1d4ed8, 0x7ab8ff], LEN = [4, 4, 2.6, 2.6], H = [-1, 1, 1, -1], PAIR = [0, 0, 1, 1], YP = [-3, 3], ZP = [1.2, -1.2];
    const cyl = new THREE.CylinderGeometry(1, 1, 1, 10), capG = new THREE.SphereGeometry(1, 10, 8);
    const ch = [];
    for (let i = 0; i < 4; i++) { const b = A.onSphere(A.rnd(1, 4)), r0 = [A.rnd(-1.5, 1.5), A.rnd(-1.5, 1.5)], h = H[i], pr = PAIR[i], L = LEN[i];
      const partner = i ^ 1; // the other homologue
      for (let j = 0; j < 2; j++) { const s = j ? 1 : -1;
        const m = M(cols[i], { roughness: 0.5 }), tipM = M(cols[i], { roughness: 0.5 });
        const crossed = (i % 2 === 0 && j === 1) || (i % 2 === 1 && j === 0); // the two inner non-sister chromatids swap tips
        const g = new THREE.Group(), body = new THREE.Mesh(cyl, m), tip = new THREE.Mesh(cyl, tipM), c1 = new THREE.Mesh(capG, m), c2 = new THREE.Mesh(capG, tipM); g.add(body, tip, c1, c2); scene.add(g);
        const cen = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8), M(0xffffff)); scene.add(cen);
        const kx = pr ? 1.6 : -1.6;
        const K = [
          [b.x + s * 0.3, b.y, b.z, 0, 0, 0, r0[0], r0[1], 0.13, L * 2.2],
          [(pr ? 3 : -3) + h * 1.1 + s * 0.45, YP[pr] * 0.6, ZP[pr], 0, 0, 0, 0.3, 0, 0.5, L],
          [h * 1.3 + s * 0.45, YP[pr], ZP[pr], 0, 0, 0, 0, 0, 0.5, L],
          [h * 7 + s * 0.45, YP[pr] * 0.8, ZP[pr], 0, 0, 0, 0, 0, 0.5, L],
          [h * 10 + s * 0.45, YP[pr] * 0.5, ZP[pr] * 0.6, 0, 0, 0, 0.2, 0, 0.4, L],
          [h * 10 + kx, s * 0.45, 0, 0, 0, 0, Math.PI / 2, 0, 0.5, L],
          [h * 10 + kx, s * 4.5, 0, 0, -s * L * 0.42, 0, 0, 0, 0.5, L],
          [h * 10 + kx * 0.5, s * 7, 0, 0, 0, 0, r0[0], r0[1], 0.2, L * 1.6]];
        ch.push({ g, body, tip, c1, c2, cen, K, h, s, tipM, own: cols[i], other: cols[partner], crossed }); } }
    const spGeo = new THREE.BufferGeometry(), spPos = new Float32Array(16 * 6); spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    const spindle = new THREE.LineSegments(spGeo, new THREE.LineBasicMaterial({ color: 0x80ed99, transparent: true })); spindle.frustumCulled = false; scene.add(spindle);
    const poles = Array.from({ length: 4 }, () => { const c = new THREE.Mesh(new THREE.SphereGeometry(0.6, 10, 8), M(0xffd166, { emissive: 0x664400 })); scene.add(c); return c; });
    A.label('Cell membrane', V(0, 15.5, 0), 400);
    const sm = x => x * x * (3 - 2 * x), lerp = (a, b, f) => a + (b - a) * f, cl = x => Math.max(0, Math.min(1, x));
    let p = 0, target = 0, auto = true, hold = 0; const LAST = 7;
    function pose(ph) {
      const k = Math.min(LAST - 1, Math.floor(ph)), f = sm(cl(ph - k));
      ch.forEach(c => { const a = c.K[k], b = c.K[k + 1], v = a.map((x, n) => lerp(x, b[n], f)), L = v[9];
        c.cen.position.set(v[0], v[1], v[2]); c.g.position.set(v[0] + v[3], v[1] + v[4], v[2] + v[5]); c.g.rotation.set(v[7], 0, v[6]);
        c.body.scale.set(v[8], L * 0.7, v[8]); c.body.position.y = -L * 0.15; c.tip.scale.set(v[8], L * 0.3, v[8]); c.tip.position.y = L * 0.35;
        c.c1.scale.setScalar(v[8]); c.c2.scale.setScalar(v[8]); c.c1.position.y = -L / 2; c.c2.position.y = L / 2; c.cen.scale.setScalar(Math.min(1, v[8] * 2));
        c.tipM.color.setHex(c.crossed && ph > 1.2 ? c.other : c.own); });
      // spindles: meiosis I (phases 1-4.3), meiosis II (4.6-7)
      const s1 = ph < 1 ? 0 : ph < 2 ? ph - 1 : ph < 3.8 ? 1 : cl((4.3 - ph) / 0.5), s2 = ph < 4.4 ? 0 : ph < 5 ? (ph - 4.4) / 0.6 : ph < 6.6 ? 1 : cl((7 - ph) / 0.4);
      const sep = cl((ph - 0.6) / 1.2);
      if (s1 > 0.01) { poles[0].position.set(-12 * sep, 8 * (1 - sep), 0); poles[1].position.set(12 * sep, 8 * (1 - sep), 0); poles[2].visible = poles[3].visible = false; poles[0].visible = poles[1].visible = true; }
      else if (s2 > 0.01) { [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([h, v], n) => { poles[n].visible = true; poles[n].position.set(h * 10, v * (ph > 6 ? 9.5 : 8), 0); }); }
      else poles.forEach(q => q.visible = false);
      let q = 0; spPos.fill(0);
      ch.forEach(c => { let pole; if (s1 > 0.01) pole = poles[c.h < 0 ? 0 : 1].position; else if (s2 > 0.01) pole = poles[(c.h < 0 ? 0 : 2) + (c.s < 0 ? 0 : 1)].position; else return; spPos.set([pole.x, pole.y, pole.z, c.cen.position.x, c.cen.position.y, c.cen.position.z], q); q += 6; });
      spGeo.attributes.position.needsUpdate = true; spindle.material.opacity = 0.85 * Math.max(s1, s2); spindle.visible = s1 > 0.01 || s2 > 0.01;
      nuc.material.opacity = ph < 1 ? 0.3 : Math.max(0, 0.3 * (1.8 - ph) / 0.8); nuc.visible = nuc.material.opacity > 0.01;
      const n4 = ph < 6.6 ? 0 : Math.min(0.3, (ph - 6.6) * 0.75); nucs4.forEach(n => { n.material.opacity = n4; n.visible = n4 > 0.01; });
      const a = cl(ph - 3.5), b2 = cl((ph - 6.2) / 0.7);
      cell.material.opacity = 0.12 * (1 - a); cell.visible = a < 0.99; cell.scale.set(1 + 0.3 * cl(ph - 2.6), 1, 1);
      ring1.visible = ph > 3.2 && a < 0.98; ring1.scale.setScalar(Math.max(0.02, 1 - a)); ring1.material.opacity = cl((ph - 3.2) * 3) * 0.8;
      two.forEach(t => { t.material.opacity = 0.12 * a * (1 - b2); t.visible = a > 0.01 && b2 < 0.99; });
      ring2.forEach(r => { r.visible = ph > 5.9 && b2 < 0.98; r.scale.setScalar(Math.max(0.02, 1 - b2)); r.material.opacity = cl((ph - 5.9) * 3) * 0.8; });
      four.forEach(t => { t.material.opacity = 0.14 * b2; t.visible = b2 > 0.01; });
      const idx = Math.min(LAST, Math.round(ph)); const el = document.getElementById('mx-phase'); if (el && el.textContent !== NAMES[idx]) el.textContent = NAMES[idx];
      if (getBar()) [...bar.children].forEach((d, n) => d.style.background = n === idx ? '#c3a6ff' : 'rgba(255,255,255,.2)');
    }
    pose(0); window.meiosisPhase = v => { auto = false; target = p = v; };
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    const orbit = a => V(Math.sin(a) * 40, 10, Math.cos(a) * 40);
    const PH = [0, 1, 2, 3, 4, 5, 6, 7, 7];
    return {
      route: [V(0, 30, 75), orbit(0.15), orbit(0.4), orbit(0.65), orbit(0.9), orbit(1.15), orbit(0.9), orbit(0.6), orbit(0.3), V(0, 30, 44)], hero, camOffset: V(0, 0, 0), outside: { target: V(0, 0, 0), dist: 62 },
      outsideInfo: { n: 'Meiosis on a loop', s: 'In this view the cell runs through both divisions of meiosis over and over. Drag to turn it.', h: 'Meiosis halves the chromosome number, from diploid (2n) to haploid (n), and makes genetically different cells that can become gametes.', cs: 'D2.1.4, D2.1.9', ch: 'D2.1.11' },
      stops: [
        { at: orbit(0.15), look: V(0, 0, 0), n: 'Interphase', s: 'DNA is replicated, so every chromosome is made of two identical sister chromatids. This cell has 4 chromosomes in 2 homologous pairs: it is diploid (2n = 4).', h: 'Homologous chromosomes carry the same genes in the same order, but may have different alleles: one came from each parent.', cs: 'D2.1.5', ch: '' },
        { at: orbit(0.4), look: V(0, 0, 0), n: 'Prophase I', s: 'Chromosomes condense and homologous chromosomes pair up side by side. Non-sister chromatids can cross over, swapping matching sections.', h: 'Crossing over makes new combinations of alleles on a chromosome. Here the inner chromatids swapped their tips, so each now carries a mix from both parents.', cs: 'D2.1.6, D2.1.11', ch: '' },
        { at: orbit(0.65), look: V(0, 0, 0), n: 'Metaphase I', s: 'Pairs of homologous chromosomes line up on the equator, one on each side.', h: 'Which way each pair faces is random and independent of the other pairs. With n pairs there are 2^n possible combinations: this is random orientation.', cs: 'D2.1.9', ch: 'D2.1.11' },
        { at: orbit(0.9), look: V(0, 0, 0), n: 'Anaphase I', s: 'Homologous chromosomes are pulled to opposite poles. The sister chromatids stay together.', h: 'This is the reduction step: each pole gets one chromosome of each pair, so the chromosome number is halved.', cs: 'D2.1.9', ch: '' },
        { at: orbit(1.15), look: V(0, 0, 0), n: 'Telophase I and cytokinesis', s: 'The cell divides into two. Each cell now has 2 chromosomes, one from each pair, but each chromosome still has two chromatids.', h: 'If a pair fails to separate in anaphase I (non-disjunction), one cell gets an extra chromosome: this is how trisomy 21 (Down syndrome) can arise.', cs: 'D2.1.9', ch: 'D2.1.10' },

        { at: orbit(0.6), look: V(0, 0, 0), n: 'Anaphase II', s: 'Sister chromatids are separated and pulled to opposite poles, as in mitosis.', h: 'Because of crossing over the sister chromatids are no longer identical, so the cells they end up in differ too.', cs: 'D2.1.9', ch: 'D2.1.11' },
        { at: orbit(0.3), look: V(0, 0, 0), n: 'Telophase II: four haploid cells', s: 'Four cells form, each with 2 chromosomes: one of each type. They are haploid (n = 2) and genetically different from each other.', h: 'In animals these cells develop into gametes. Fertilisation joins two haploid gametes, restoring the diploid number.', cs: 'D2.1.9, D2.1.11', ch: '' },
        { at: V(0, 30, 44), look: V(0, 0, 0), n: 'Compare with mitosis', s: 'Mitosis: one division, two identical diploid cells. Meiosis: two divisions, four different haploid cells.', h: 'Variation from meiosis comes from crossing over, random orientation of pairs, and later from random fertilisation.', cs: 'D2.1.4', ch: 'D2.1.11' }
      ],
      side: '<div style="font-size:12px;opacity:.75">Phase now</div><div id="mx-phase" style="font-size:20px;font-weight:700">Interphase</div><div id="mx-bar" style="display:flex;gap:3px;margin-top:6px"></div>',
      onStop(i) { auto = false; target = PH[i]; },
      onView(v) { if (v === 'out') auto = true; },
      update(dt, A) { const run = A.paused ? 0 : dt;

        pose(p);
      }
    };
  }
};

<script>
/* What the Cell walk-through engine (2026-11-16). A page supplies window.JOURNEY = {title, sub, intro, note, theme,
   rideLabel, build(api)}; build returns {route:[Vector3...], stops:[{at,n,s,h,cs,ch}], outside:{target,dist},
   hero (mesh, optional), camOffset (Vector3), update(dt, api), side (html, optional), fog}.
   Stops: s = SL text, h = extra HL text, cs = SL codes, ch = extra HL codes. */
(function(){
'use strict';
const J=window.JOURNEY; const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const th=J.theme||{}; Object.keys(th).forEach(k=>document.documentElement.style.setProperty('--'+k,th[k]));
$('t-title').textContent=J.title; $('t-sub').textContent=J.sub||''; $('s-title').textContent=J.startTitle||J.title; $('s-intro').textContent=J.intro||''; $('s-note').textContent=J.note||'';
$('v-ride').textContent=J.rideLabel||'Ride'; $('c').setAttribute('aria-label',J.title+': 3D model. Use the arrow keys or the Next button to move between stops.');
let level='sl'; try{ if(localStorage.getItem('wtc-cell-level')==='hl') level='hl'; }catch(e){}
const canvas=$('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const bg=new THREE.Color(th.bg||'#0b1a2a'); renderer.setClearColor(bg);
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(bg,J.fog||0.006);
const camera=new THREE.PerspectiveCamera(65,1,0.1,900); camera.rotation.order='YXZ'; scene.add(camera);
scene.add(new THREE.HemisphereLight(0xf2f6ff,0x20202a,0.9)); camera.add(new THREE.PointLight(0xffffff,0.55,160));
const sun=new THREE.DirectionalLight(0xffffff,0.5); sun.position.set(40,70,80); scene.add(sun);
const labels=[], anims=[];
const api={THREE, scene, camera, reduceMotion, paused:false, t:0,
  V:(x,y,z)=>new THREE.Vector3(x,y,z),
  M:(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.55,metalness:0.05},o||{})),
  T:(c,op,side)=>new THREE.MeshStandardMaterial({color:c,roughness:0.55,metalness:0.05,transparent:true,opacity:op,side:side||THREE.DoubleSide,depthWrite:false}),
  tube:(pts,r,mat,seg,closed)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,!!closed),seg||64,r,14,!!closed),mat),
  label:(text,pos,far)=>{ const el=document.createElement('div'); el.className='lab'; el.textContent=text; $('labels').appendChild(el); labels.push({el,pos,far:far||70}); },
  anim:fn=>anims.push(fn), level:()=>level, rnd:(a,b)=>a+Math.random()*(b-a),
  onSphere:r=>{ const u=Math.random()*2-1, a=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u); return new THREE.Vector3(r*s*Math.cos(a),r*u,r*s*Math.sin(a)); },
  side:html=>{ $('side').innerHTML=html; $('side').hidden=!html; }, button:(id,label,fn)=>{ const b=document.createElement('button'); b.type='button'; b.id=id; b.textContent=label; b.setAttribute('aria-pressed','false'); b.onclick=()=>fn(b); $('extra').prepend(b); return b; },
  refresh:()=>showStop() };
const W=J.build(api);
const route=new THREE.CatmullRomCurve3(W.route,false,'catmullrom',0.3);
function nearestU(p){ let best=0,bd=1e9; for(let i=0;i<=800;i++){ const u=i/800, d=route.getPointAt(u).distanceTo(p); if(d<bd){ bd=d; best=u; } } return best; }
const STOPS=W.stops.map(s=>Object.assign(s,{u:s.u!=null?s.u:nearestU(s.at)}));
const hero=W.hero||new THREE.Mesh(new THREE.SphereGeometry(1,16,12),api.M(0xffd166,{emissive:0x442200})); if(!W.hero) scene.add(hero);
const camOff=W.camOffset||api.V(0,3,5);
let view='ride', stop=0, u=STOPS[0].u, uTarget=u, yawOff=0, pitchOff=0; const out=W.outside||{target:api.V(0,0,0),dist:150}; let oy=0.5, op=0.2, od=out.dist;
api.u=()=>u; api.route=route; api.stop=()=>stop; api.view=()=>view;
function showStop(){ const info=$('info');
  if(view==='out'){ const o=W.outsideInfo||{n:'Outside view',s:'Drag to turn the model and scroll to zoom.'};
    info.innerHTML='<div class="eyebrow">Outside view</div><h2></h2><p></p>'+(o.cs?'<div class="codes"></div>':'')+'<div class="nav"><button type="button" class="go" id="n-ride"></button></div>';
    info.querySelector('h2').textContent=o.n; info.querySelector('p').textContent=o.s+(level==='hl'&&o.h?' '+o.h:''); if(o.cs) info.querySelector('.codes').textContent='Syllabus: '+o.cs+(level==='hl'&&o.ch?', '+o.ch:'');
    $('n-ride').textContent=J.rideLabel||'Ride'; $('n-ride').onclick=()=>setView('ride'); if(W.onView) W.onView('out'); return; }
  const s=STOPS[stop]; info.innerHTML='<div class="eyebrow"></div><h2></h2><p></p><div class="codes"></div><div class="nav"><button type="button" id="n-prev">Back</button><button type="button" class="go" id="n-next"></button></div>';
  info.querySelector('.eyebrow').textContent='Stop '+(stop+1)+' of '+STOPS.length; info.querySelector('h2').textContent=s.n;
  info.querySelector('p').textContent=s.s+(level==='hl'&&s.h?' '+s.h:''); info.querySelector('.codes').textContent='Syllabus: '+s.cs+(level==='hl'&&s.ch?', '+s.ch:'');
  const nx=$('n-next'); nx.textContent=stop===STOPS.length-1?'Start again':'Next stop'; $('n-prev').onclick=()=>go(-1); nx.onclick=()=>go(1);
  if(W.onStop) W.onStop(stop, s); if(W.onView) W.onView('ride'); }
function go(d){ if(view!=='ride') return; stop+=d; if(stop>=STOPS.length){ stop=0; u=STOPS[0].u; } if(stop<0) stop=0; uTarget=STOPS[stop].u; yawOff=0; pitchOff=0; showStop(); }
function setView(v){ view=v; $('v-ride').setAttribute('aria-pressed',v==='ride'); $('v-out').setAttribute('aria-pressed',v==='out'); scene.fog.density=v==='out'?(J.fog||0.006)*0.3:(J.fog||0.006); showStop(); }
function setLevel(l){ level=l; try{ localStorage.setItem('wtc-cell-level',l); }catch(e){} $('l-sl').setAttribute('aria-pressed',l==='sl'); $('l-hl').setAttribute('aria-pressed',l==='hl'); showStop(); }
function togglePause(){ api.paused=!api.paused; $('b-pause').setAttribute('aria-pressed',api.paused); $('b-pause').textContent=api.paused?'Play':'Pause'; }
$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
$('b-pause').onclick=togglePause; $('b-help').onclick=()=>{ $('start').hidden=false; }; $('b-start').onclick=()=>{ $('start').hidden=true; canvas.focus(); };
window.addEventListener('keydown',e=>{ if(!$('start').hidden) return; if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); go(1); } else if(e.code==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.code==='KeyP') togglePause(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};
  if(view==='ride'){ yawOff-=dx*0.004; pitchOff=Math.max(-1.2,Math.min(1.2,pitchOff-dy*0.004)); } else { oy-=dx*0.006; op=Math.max(-1.3,Math.min(1.3,op+dy*0.006)); } });
canvas.addEventListener('pointerup',()=>{ drag=null; });
canvas.addEventListener('wheel',e=>{ if(view==='out'){ e.preventDefault(); od=Math.max(out.dist*0.4,Math.min(out.dist*2,od+e.deltaY*0.1)); } },{passive:false});
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
const v=new THREE.Vector3(); let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if(!api.paused) api.t+=dt;
  const du=uTarget-u; u+=du*Math.min(1,dt*(reduceMotion?20:1.5)); if(Math.abs(du)<0.0004) u=uTarget;
  hero.position.copy(route.getPointAt(Math.min(0.999,Math.max(0,u))));
  if(W.update) W.update(dt,api); anims.forEach(f=>f(dt,api));
  if(view==='ride'){ const ahead=route.getPointAt(Math.min(0.999,u+0.02)), behind=route.getPointAt(Math.max(0,u-0.03));
    camera.position.copy(behind).add(camOff); let d=ahead.clone().sub(camera.position).normalize();
    const lk=STOPS[stop].look; if(lk){ const near=Math.max(0,1-Math.abs(uTarget-u)/0.03); if(near>0) d.lerp(lk.clone().sub(camera.position).normalize(),near).normalize(); }
    camera.rotation.set(Math.asin(Math.max(-1,Math.min(1,d.y)))+pitchOff, Math.atan2(-d.x,-d.z)+yawOff, 0); }
  else { if(!drag&&!reduceMotion) oy+=dt*0.12; camera.position.set(out.target.x+Math.sin(oy)*Math.cos(op)*od, out.target.y+Math.sin(op)*od, out.target.z+Math.cos(oy)*Math.cos(op)*od); camera.lookAt(out.target); }
  const w=canvas.clientWidth,h=canvas.clientHeight;
  labels.forEach(l=>{ v.copy(l.pos).project(camera); const d=camera.position.distanceTo(l.pos); const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05&&(view==='out'||d<l.far);
    if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=view==='out'?0.95:Math.max(0.3,1.2-d/l.far); } else l.el.style.display='none'; });
  renderer.render(scene,camera); requestAnimationFrame(frame); }
if(W.side) api.side(W.side);
setLevel(level); resize(); requestAnimationFrame(frame);
})();

</script>
</body>
</html>
