<script>
window.JOURNEY = {
  title: 'The DNA Factory',
  sub: 'DP Biology D1.1 and D1.2 · simplified, not to scale',
  startTitle: 'From DNA to protein',
  intro: 'Watch DNA being copied at a replication fork, a gene being transcribed into mRNA, and the mRNA leaving the nucleus to be translated by a ribosome into a polypeptide.',
  note: 'Bases: adenine red, thymine yellow, cytosine blue, guanine green, uracil purple. Old DNA strands are dark grey, new strands white, mRNA orange.',
  rideLabel: 'Follow the information',
  theme: { bg: '#0d0f1d', panel: 'rgba(14,16,34,.86)', accent: '#ffb703', dim: '#c4c7de', line: 'rgba(200,205,255,.22)' },
  fog: 0.004,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const BASE = [0xe63946, 0xffd166, 0x4ea8de, 0x52b788], PAIR = [1, 0, 3, 2], seq = []; for (let i = 0; i < 200; i++) seq.push(Math.floor(Math.random() * 4));
    const oldM = M(0x5c5f6b), newM = M(0xf1f1f1), rnaM = M(0xff8c42);
    // Instanced pieces for the replication fork: backbone beads and base rungs for up to 4 strands
    const N = 70, X0 = -80, DX = 1.0;
    const beadOld = new THREE.InstancedMesh(new THREE.SphereGeometry(0.42, 8, 6), oldM, N * 2), beadNew = new THREE.InstancedMesh(new THREE.SphereGeometry(0.42, 8, 6), newM, N * 2);
    const rung = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18, 0.18, 1, 6), M(0xffffff), N * 4); rung.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 4 * 3), 3);
    scene.add(beadOld, beadNew, rung);
    const d = new THREE.Object3D(), col = new THREE.Color();
    function place(mesh, i, p) { d.position.copy(p); d.rotation.set(0, 0, 0); d.scale.set(1, 1, 1); d.updateMatrix(); mesh.setMatrixAt(i, d.matrix); }
    function rungAt(i, a, b, c) { const mid = a.clone().add(b).multiplyScalar(0.5), len = a.distanceTo(b); d.position.copy(mid); d.scale.set(1, Math.max(0.01, len), 1); d.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize()); d.updateMatrix(); rung.setMatrixAt(i, d.matrix); col.setHex(c); rung.setColorAt(i, col); }
    const helicase = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.9, 10, 24), M(0x9b5de5)); helicase.rotation.y = Math.PI / 2; scene.add(helicase);
    const polA = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 12), M(0x2a9d8f)), polB = polA.clone(); scene.add(polA, polB);
    // Transcription: a gene with RNA polymerase moving along it, making mRNA
    const TX0 = -10, TN = 34; const tOld = new THREE.InstancedMesh(new THREE.SphereGeometry(0.42, 8, 6), oldM, TN * 2), tRung = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18, 0.18, 1, 6), M(0xffffff), TN); tRung.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(TN * 3), 3);
    scene.add(tOld, tRung); const rnap = new THREE.Mesh(new THREE.SphereGeometry(2.6, 18, 14), M(0xf4a261, { transparent: true, opacity: 0.75 })); scene.add(rnap);
    const mBeads = new THREE.InstancedMesh(new THREE.SphereGeometry(0.4, 8, 6), rnaM, 60); scene.add(mBeads);
    // Nuclear envelope with a pore, then a ribosome in the cytoplasm
    const env = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), T(0x8f6bd8, 0.25)); env.scale.set(80, 60, 1); env.rotation.y = Math.PI / 2; env.position.x = 30; scene.add(env);
    const pore = new THREE.Mesh(new THREE.TorusGeometry(3, 0.9, 10, 24), M(0xcdb6f2)); pore.rotation.y = Math.PI / 2; pore.position.set(30, 8, 0); scene.add(pore);
    const mPath = new THREE.CatmullRomCurve3([V(TX0 + 17, 2.5, 0), V(20, 8, 0), V(30, 8, 0), V(40, 4, 0), V(48, 0, 0), V(70, 0, 0)]);
    const big = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), M(0x5f6caf, { transparent: true, opacity: 0.85 })); big.scale.set(6, 4.2, 5); big.position.set(55, 3.5, 0); scene.add(big);
    const small = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), M(0x8d99ae, { transparent: true, opacity: 0.85 })); small.scale.set(5, 2.4, 4); small.position.set(55, -2.2, 0); scene.add(small);
    const ribRNA = new THREE.InstancedMesh(new THREE.SphereGeometry(0.4, 8, 6), rnaM, 40); scene.add(ribRNA);
    const tr = []; for (let i = 0; i < 3; i++) { const g = new THREE.Group(); const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 8), M(0xb5838d)); g.add(stem); const arm = stem.clone(); arm.scale.y = 0.6; arm.rotation.z = Math.PI / 2; arm.position.set(1.4, 2.2, 0); g.add(arm);
      const aa = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), M([0xe9c46a, 0x90be6d, 0xf28482][i])); aa.position.y = 3.2; g.add(aa); scene.add(g); tr.push({ g, aa }); }
    const chain = []; for (let i = 0; i < 18; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), M([0xe9c46a, 0x90be6d, 0xf28482, 0x84a59d][i % 4])); scene.add(m); chain.push(m); }
    A.label('Helicase', V(-45, 5, 0)); A.label('DNA polymerase', V(-55, -6, 3)); A.label('New strands (white)', V(-70, 7, 0)); A.label('RNA polymerase', V(TX0 + 12, 5.5, 0)); A.label('mRNA', V(22, 11, 0)); A.label('Nuclear pore', V(30, 13, 0)); A.label('Nucleus', V(0, 22, -10), 300); A.label('Cytoplasm', V(60, 22, -10), 300); A.label('Ribosome', V(55, 10, 0)); A.label('tRNA', V(52, 13, 4)); A.label('Polypeptide', V(57, 18, 2));
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    return {
      route: [V(-90, 6, 26), V(-62, 6, 22), V(-48, 4, 18), V(-30, 4, 20), V(0, 6, 20), V(22, 8, 18), V(40, 8, 22), V(55, 6, 24), V(56, 12, 26)], hero, camOffset: V(0, 0, 0), outside: { target: V(-5, 2, 0), dist: 105 },
      outsideInfo: { n: 'The flow of information', s: 'DNA is copied before a cell divides (replication). A gene is copied into mRNA (transcription), and ribosomes use the mRNA to build a polypeptide (translation).', h: 'In eukaryotes transcription happens in the nucleus and translation in the cytoplasm, so the mRNA can be processed in between.', cs: 'D1.1.1, D1.2.1, D1.2.5', ch: 'D1.2.15' },
      stops: [
        { at: V(-62, 6, 22), look: V(-62, 0, 0), n: 'The double helix', s: 'DNA is two strands held together by hydrogen bonds between complementary bases: adenine with thymine, cytosine with guanine.', h: 'The two strands run in opposite directions (antiparallel): one 5′ to 3′, the other 3′ to 5′.', cs: 'D1.1.1', ch: 'A1.2.11' },
        { at: V(-48, 4, 18), look: helicase.position, n: 'Helicase unzips the DNA', s: 'Helicase moves along the DNA, breaking the hydrogen bonds and separating the two strands at the replication fork.', h: 'Helicase uses energy from ATP. The separated strands are kept apart so both can act as templates.', cs: 'D1.1.3', ch: '' },
        { at: V(-30, 4, 20), look: V(-62, 0, 0), n: 'DNA polymerase builds new strands', s: 'DNA polymerase adds free nucleotides to each template strand by complementary base pairing. Each new DNA molecule has one old and one new strand: replication is semi-conservative.', h: 'DNA polymerase III only adds nucleotides in the 5′ to 3′ direction, so one strand is made continuously (leading) and the other in short Okazaki fragments (lagging). Primase lays down RNA primers; DNA polymerase I replaces them with DNA and ligase joins the fragments.', cs: 'D1.1.2, D1.1.3', ch: 'D1.1.6, D1.1.7, D1.1.8' },
        { at: V(0, 6, 20), look: V(TX0 + 14, 0, 0), n: 'Transcription', s: 'RNA polymerase separates the two strands of a gene and builds mRNA by complementary base pairing to one strand, the template. Uracil (purple) pairs with adenine instead of thymine.', h: 'RNA polymerase binds at the promoter and moves 5′ to 3′ along the new RNA. Only the template strand is read; the DNA zips back up behind it.', cs: 'D1.2.1, D1.2.2', ch: 'D1.2.12, D1.2.13' },
        { at: V(22, 8, 18), look: pore.position, n: 'Out through a nuclear pore', s: 'The mRNA leaves the nucleus through a nuclear pore and goes to a ribosome in the cytoplasm.', h: 'Before leaving, eukaryotic mRNA is processed: introns are removed by splicing, and a cap and a tail are added.', cs: 'D1.2.4', ch: 'D1.2.15' },
        { at: V(55, 6, 24), look: V(55, 2, 0), n: 'Translation at the ribosome', s: 'The ribosome reads the mRNA three bases (one codon) at a time. A tRNA with the matching anticodon brings the correct amino acid.', h: 'tRNAs enter at the A site, the growing chain is held at the P site, and empty tRNAs leave from the E site. Translation starts at the start codon AUG.', cs: 'D1.2.5, D1.2.6, D1.2.7', ch: 'D1.2.10, D1.2.17' },
        { at: V(56, 12, 26), look: V(57, 14, 0), n: 'A growing polypeptide', s: 'Peptide bonds join the amino acids into a polypeptide. When the ribosome reaches a stop codon, the polypeptide is released.', h: 'The polypeptide then folds and may be modified, for example by cutting or by adding carbohydrate, before it can work.', cs: 'D1.2.10', ch: 'D1.2.18' }
      ],
      update(dt, A) {
        const t = A.t; const fork = -14 - ((t * 3) % 56); helicase.position.set(fork, 0, 0);
        let io = 0, inw = 0, ir = 0;
        for (let i = 0; i < N; i++) { const x = X0 + i * DX, a = x * 0.6, b = seq[i];
          if (x > fork) { const p1 = V(x, Math.cos(a) * 2, Math.sin(a) * 2), p2 = V(x, -Math.cos(a) * 2, -Math.sin(a) * 2); place(beadOld, io++, p1); place(beadOld, io++, p2); rungAt(ir++, p1, p2, BASE[b]); }
          else { const sep = Math.min(5, (fork - x) * 0.7);
            [1, -1].forEach(s => { const c = V(x, s * sep, 0); const p1 = c.clone().add(V(0, Math.cos(a) * 2, Math.sin(a) * 2)), p2 = c.clone().add(V(0, -Math.cos(a) * 2, -Math.sin(a) * 2));
              const lagging = s < 0, show = !lagging || (A.level() === 'hl' ? ((fork - x) % 9) > 2 : true);
              place(beadOld, io++, p1); if (show) { place(beadNew, inw++, p2); rungAt(ir++, p1, p2, BASE[s > 0 ? b : PAIR[b]]); } }); } }
        beadOld.count = io; beadNew.count = inw; rung.count = ir; [beadOld, beadNew, rung].forEach(m => { m.instanceMatrix.needsUpdate = true; }); rung.instanceColor.needsUpdate = true;
        polA.position.set(fork - 3, 5, 0); polB.position.set(fork - 3, -5, 0);
        // transcription bubble
        const bub = TX0 + ((t * 2) % (TN - 4)); rnap.position.set(bub, 0, 0); let ti = 0, tri = 0, mi = 0;
        for (let i = 0; i < TN; i++) { const x = TX0 + i, a = x * 0.6, b = seq[100 + i], open = Math.abs(x - bub) < 3; const r = open ? 3.2 : 2;
          const p1 = V(x, Math.cos(a) * r, Math.sin(a) * r), p2 = V(x, -Math.cos(a) * r, -Math.sin(a) * r); place(tOld, ti++, p1); place(tOld, ti++, p2);
          if (!open) { const mid = p1.clone().add(p2).multiplyScalar(0.5), len = p1.distanceTo(p2); d.position.copy(mid); d.scale.set(1, len, 1); d.quaternion.setFromUnitVectors(V(0, 1, 0), p2.clone().sub(p1).normalize()); d.updateMatrix(); tRung.setMatrixAt(tri, d.matrix); col.setHex(BASE[b]); tRung.setColorAt(tri++, col); } }
        tOld.count = ti; tRung.count = tri; tOld.instanceMatrix.needsUpdate = true; tRung.instanceMatrix.needsUpdate = true; tRung.instanceColor.needsUpdate = true;
        for (let k = 0; k < 40; k++) { const u = ((t * 0.06) + k / 40) % 1; place(mBeads, mi++, mPath.getPointAt(u * 0.62)); } mBeads.count = mi; mBeads.instanceMatrix.needsUpdate = true;
        let ri = 0; for (let k = 0; k < 30; k++) { const x = 40 + ((k * 1.2 + t * 2) % 36); place(ribRNA, ri++, V(x, 0.2, 0)); } ribRNA.count = ri; ribRNA.instanceMatrix.needsUpdate = true;
        tr.forEach((o, i) => { const ph = ((t * 0.5) + i / 3) % 1; o.g.position.set(50 + ph * 10, 4 + (ph < 0.2 ? (0.2 - ph) * 40 : 0) + (ph > 0.8 ? (ph - 0.8) * 40 : 0), 0.5 + i); o.aa.visible = ph < 0.55; });
        chain.forEach((m, i) => { const s = i * 1.6; m.position.set(55 + Math.sin(i * 0.9 + t * 0.3) * 2.5, 8 + s * 0.8, Math.cos(i * 0.9) * 2.5); m.visible = i < 6 + Math.floor((t * 0.8) % 12); });
      }
    };
  }
};

<script>
/* What the Cell walk-through engine (2026-11-16). A page supplies window.JOURNEY = {title, sub, intro, note, theme,

   steps:[{n,s,h,cs,ch,at,dist}], build(api) -> {update(dt,api,step), onStep(i,step)}}. W.dives lists close-ups for the outside view.

(function(){

const $=id=>document.getElementById(id);

const camera=new THREE.PerspectiveCamera(65,1,0.1,900); camera.rotation.order='YXZ'; scene.add(camera);

function showDef(t,d){ $('def-h').textContent=t; $('def-p').textContent=d; $('defbox').hidden=false; }
$('def-x').onclick=()=>{ $('defbox').hidden=true; };

  side:html=>{ $('side').innerHTML=html; $('side').hidden=!html; }, button:(id,label,fn)=>{ const b=document.createElement('button'); b.type='button'; b.id=id; b.textContent=label; b.setAttribute('aria-pressed','false'); b.onclick=()=>fn(b); $('extra').prepend(b); return b; },

const diveScene=new THREE.Scene(); diveScene.add(new THREE.HemisphereLight(0xf2f6ff,0x2a2a33,0.95));
const dSun=new THREE.DirectionalLight(0xffffff,0.6); dSun.position.set(30,60,50); diveScene.add(dSun);
const dCam=new THREE.PerspectiveCamera(50,1,0.1,900); dCam.add(new THREE.PointLight(0xffffff,0.35,300)); diveScene.add(dCam);
let dive=null, dStep=0, dYaw=0.5, dPitch=0.25, dDist=60, dDistGoal=60, sideBefore=null;
const dTarget=new THREE.Vector3(), dTargetGoal=new THREE.Vector3();
function dives(s){ return s?[].concat(s.dives||[],s.dive?[s.dive]:[]):[]; }
function openDive(d){

function closeDive(){ leaveDive(); showStop(); }
api.openDive=openDive;
function showDive(){ const info=$('info'), st=dive.steps[dStep];
  info.innerHTML='<div class="eyebrow"></div><h2></h2><p></p><div class="codes"></div><div class="nav"><button type="button" id="d-prev">Back</button><button type="button" class="go" id="d-next"></button><button type="button" id="d-exit">Leave close-up</button></div>';
  info.querySelector('.eyebrow').textContent='Close-up: '+dive.n+' · step '+(dStep+1)+' of '+dive.steps.length; info.querySelector('h2').textContent=st.n;
  info.querySelector('p').textContent=st.s+(level==='hl'&&st.h?' '+st.h:'');
  const cd=info.querySelector('.codes'); if(st.cs) cd.textContent='Syllabus: '+st.cs+(level==='hl'&&st.ch?', '+st.ch:''); else cd.remove();
  const nx=$('d-next'); const lastStep=dStep===dive.steps.length-1; nx.textContent=lastStep?'Leave close-up':'Next step';
  $('d-prev').onclick=()=>dGo(-1); nx.onclick=()=>{ if(lastStep) closeDive(); else dGo(1); }; if(lastStep) $('d-exit').remove(); else $('d-exit').onclick=closeDive;
  dTargetGoal.copy(st.at||dive.target||api.V(0,0,0)); dDistGoal=st.dist||dive.dist||60;
  if(dive.ctl.onStep) dive.ctl.onStep(dStep,st); }
function dGo(k){ dStep=Math.max(0,Math.min(dive.steps.length-1,dStep+k)); showDive(); }
function diveButtons(list,nav){ list.forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.className='zoom'; b.textContent='⌕ Zoom in: '+d.n; b.onclick=()=>openDive(d); nav.appendChild(b); }); }
function showStop(){ if(dive) return showDive(); const info=$('info');
  if(view==='out'){ const o=W.outsideInfo||{n:'Outside view',s:'Drag to turn the model and scroll to zoom.'};
    info.innerHTML='<div class="eyebrow">Outside view</div><h2></h2><p></p>'+(o.cs?'<div class="codes"></div>':'')+'<div class="nav"><button type="button" class="go" id="n-ride"></button></div>';
    info.querySelector('h2').textContent=o.n; info.querySelector('p').textContent=o.s+(level==='hl'&&o.h?' '+o.h:''); if(o.cs) info.querySelector('.codes').textContent='Syllabus: '+o.cs+(level==='hl'&&o.ch?', '+o.ch:'');
    $('n-ride').textContent=J.rideLabel||'Ride'; $('n-ride').onclick=()=>setView('ride'); diveButtons(W.dives||[],info.querySelector('.nav')); if(W.onView) W.onView('out'); return; }
  const s=STOPS[stop]; info.innerHTML='<div class="eyebrow"></div><h2></h2><p></p><div class="codes"></div><div class="nav"><button type="button" id="n-prev">Back</button><button type="button" class="go" id="n-next"></button></div>';
  info.querySelector('.eyebrow').textContent='Stop '+(stop+1)+' of '+STOPS.length; info.querySelector('h2').textContent=s.n;
  info.querySelector('p').textContent=s.s+(level==='hl'&&s.h?' '+s.h:''); info.querySelector('.codes').textContent='Syllabus: '+s.cs+(level==='hl'&&s.ch?', '+s.ch:'');
  const nx=$('n-next'); nx.textContent=stop===STOPS.length-1?'Start again':'Next stop'; $('n-prev').onclick=()=>go(-1); nx.onclick=()=>go(1); diveButtons(dives(s),info.querySelector('.nav'));
  if(W.onStop) W.onStop(stop, s); if(W.onView) W.onView('ride'); }
function go(d){ if(dive){ dGo(d); return; } if(view!=='ride') return; stop+=d; if(stop>=STOPS.length){ stop=0; u=STOPS[0].u; } if(stop<0) stop=0; uTarget=STOPS[stop].u; yawOff=0; pitchOff=0; showStop(); }
function setView(v){ if(dive) leaveDive(); view=v; $('v-ride').setAttribute('aria-pressed',v==='ride'); $('v-out').setAttribute('aria-pressed',v==='out'); scene.fog.density=v==='out'?(J.fog||0.006)*0.3:(J.fog||0.006); showStop(); }
function setLevel(l){ level=l; try{ localStorage.setItem('wtc-cell-level',l); }catch(e){} $('l-sl').setAttribute('aria-pressed',l==='sl'); $('l-hl').setAttribute('aria-pressed',l==='hl'); showStop(); }
function togglePause(){ api.paused=!api.paused; $('b-pause').setAttribute('aria-pressed',api.paused); $('b-pause').textContent=api.paused?'Play':'Pause'; }
$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
$('b-pause').onclick=togglePause; $('b-help').onclick=()=>{ $('start').hidden=false; }; $('b-start').onclick=()=>{ $('start').hidden=true; canvas.focus(); };
window.addEventListener('keydown',e=>{ if(!$('start').hidden) return; if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); go(1); } else if(e.code==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.code==='KeyP') togglePause(); else if(e.code==='Escape'&&dive) closeDive(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};

  else if(view==='ride'){ yawOff-=dx*0.004; pitchOff=Math.max(-1.2,Math.min(1.2,pitchOff-dy*0.004)); } else { oy-=dx*0.006; op=Math.max(-1.3,Math.min(1.3,op+dy*0.006)); } });

canvas.addEventListener('wheel',e=>{ if(dive){ e.preventDefault(); const base=dive.steps[dStep].dist||dive.dist||60; dDistGoal=Math.max(base*0.3,Math.min(base*2.5,dDistGoal+e.deltaY*0.05)); return; } if(view==='out'){ e.preventDefault(); od=Math.max(out.dist*0.4,Math.min(out.dist*2,od+e.deltaY*0.1)); } },{passive:false});
let sizeW=0,sizeH=0;
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; sizeW=w; sizeH=h; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); dCam.aspect=w/h; dCam.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
const v=new THREE.Vector3(); let last=performance.now();
function step(now){ if(canvas.clientWidth!==sizeW||canvas.clientHeight!==sizeH) resize(); const dt=Math.min(0.05,(now-last)/1000); last=now; if(!api.paused) api.t+=dt;
  const du=uTarget-u; u+=du*Math.min(1,dt*(reduceMotion?20:1.5)); if(Math.abs(du)<0.0004) u=uTarget;

    labels.forEach(l=>{ if(l.dv!==dive){ l.el.style.display='none'; return; } v.copy(l.pos).applyMatrix4(dive.group.matrixWorld).project(dCam); const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05&&l.el.dataset.off!=='1';
      if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=0.95; } else l.el.style.display='none'; });
    renderer.render(diveScene,dCam); return; }

    const lk=STOPS[stop].look; if(lk){ const near=Math.max(0.7,1-Math.abs(uTarget-u)/0.03); d.lerp(lk.clone().sub(camera.position).normalize(),near).normalize(); }

{ const m=/^#zoom-(\d+)$/.exec(location.hash); if(m&&W.dives&&W.dives[+m[1]]){ $('start').hidden=true; openDive(W.dives[+m[1]]); } }
window.journeyDebug={openDive, go, tick:n=>{ for(let i=0;i<n;i++){ last-=33; step(last+33); } }, dives:()=>W.dives, stops:STOPS};
})();
