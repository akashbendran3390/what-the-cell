<script>
// Translation (2026-11-17, teacher's request). The ribosome stays in the middle; the mRNA slides through it one
// codon at a time. A side panel shows the codon in the A site, the anticodon, the amino acid and the chain so far.
window.JOURNEY = {
  title: 'Translation: mRNA to protein',
  sub: 'DP Biology D1.2 · simplified, not to scale',
  startTitle: 'Build a polypeptide',
  intro: 'Watch a ribosome read an mRNA one codon at a time. tRNA molecules bring amino acids, their anticodons pair with the codons, peptide bonds join the amino acids, and the ribosome moves along until it reaches a stop codon.',
  note: 'mRNA bases: adenine red, uracil purple, guanine green, cytosine blue. Each amino acid has its own colour; the panel on the right names them. The real process adds several amino acids per second.',
  rideLabel: 'Step through translation',
  theme: { bg: '#0e0d1a', panel: 'rgba(16,14,30,.88)', accent: '#80ed99', dim: '#c8c4de', line: 'rgba(210,200,255,.22)' },
  fog: 0.003,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const cl = (x, a, b) => Math.max(a, Math.min(b, x)), ramp = (p, a, b) => cl((p - a) / (b - a), 0, 1), ease = k => k * k * (3 - 2 * k);

    const bases = () => UTR + COD.map((c, k) => codonOf(k)).join('') + 'GCAUAGCAA';

    const NB = 6 + 27 + 9; const mBead = [], mBase = [];
    for (let j = 0; j < NB; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.36, 10, 8), M(0xff9f1c)); scene.add(b); mBead.push(b); const s = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.1, 8), M(0xffffff)); scene.add(s); mBase.push(s); }
    const capM = new THREE.Mesh(new THREE.SphereGeometry(0.75, 12, 8), M(0xef233c)); scene.add(capM);
    function paintMRNA() { const s = bases(); for (let j = 0; j < NB; j++) mBase[j].material.color.setHex(BC[s[j]] || 0xffffff); }

    const lumpy = (r, c, op) => { const g = new THREE.SphereGeometry(r, 40, 30); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const v = V(p.getX(i), p.getY(i), p.getZ(i)); const k = 1 + 0.08 * Math.sin(v.x * 1.3 + v.y) * Math.cos(v.z * 1.1); p.setXYZ(i, v.x * k, v.y * k, v.z * k); } g.computeVertexNormals();

    const large = lumpy(1, 0x8fb8de, 0.26); large.scale.set(8.6, 5.2, 5.6); scene.add(large);

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.55, 3.6, 12), body); stem.position.y = 2.9; g.add(stem);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 2.4, 12), body); arm.rotation.z = Math.PI / 2; arm.position.set(1.0, 4.4, 0); g.add(arm);

    lab.trna = L('tRNA', V(8, 9, 4)); lab.chain = L('Polypeptide', V(-6, 16, 0)); lab.rf = L('Release factor', V(5, 9, 2)); lab.prot = L('Proteasome', V(24, 2, -4), 120);
    // side panel
    const side = '<h3>Reading the code</h3><div class="row">Codon (A site): <b id="tl-c" style="margin-left:auto">-</b></div><div class="row">Anticodon: <b id="tl-a" style="margin-left:auto">-</b></div><div class="row">Amino acid: <b id="tl-n" style="margin-left:auto">-</b></div>' +
      '<p style="margin:6px 0 2px;color:var(--dim)">Polypeptide so far</p><p id="tl-p" style="margin:0;font:700 14px var(--body);word-break:break-word">-</p>' +
      '<p style="margin:8px 0 2px;color:var(--dim)">Codons used here</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font:12px ui-monospace,monospace">' +
      COD.map((c, k) => '<span id="tl-t' + k + '">' + c + ' ' + (k < 8 ? AA[k][0] : 'stop') + '</span>').join('') + '<span id="tl-tm">GUG Val</span></div>';
    let mode = 0, tm = 0; const SPAWN = V(12, 16, 8), EXIT = V(-13, 15, 8), UP = V(0, 1.25, 0);
    function chainOff(n) { return n <= 5 ? V(0, 1.25 * n, -0.2 * n) : V(-(n - 5) * 1.2, 6.25 + Math.sin(n) * 0.6, -1 + Math.cos(n * 0.8) * 0.8); }
    function setText(id, t) { const e = document.getElementById(id); if (e) e.textContent = t; }
    function state(t) { const full = 46; let tt;
      if (mode === 1) tt = t % 9; else if (mode >= 2 && mode <= 5) tt = 8 + (t % 28); else if (mode === 6) tt = 36 + (t % 7.5); else if (mode === 8) tt = 36 + Math.min(t, 9.9); else tt = t % full;
      if (tt < 8) return { ph: 'init', ti: tt }; if (tt < 36) { const e = tt - 8; return { ph: 'elong', c: Math.floor(e / 4), f: (e % 4) / 4 }; } if (tt < 43) return { ph: 'term', ti: tt - 36 }; return { ph: 'done', ti: tt - 43 }; }

    if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=view==='out'?0.95:Math.max(0.3,1.2-d/l.far); } else l.el.style.display='none'; });
  renderer.render(scene,camera); }
