<script>

  title: 'Mitosis in 3D',
  sub: 'DP Biology D2.1 · simplified, not to scale',
  startTitle: 'One cell becomes two',
  intro: 'Watch a cell with four chromosomes divide. Step through each phase of mitosis and cytokinesis, turn the cell to see the spindle from any side, and check that each daughter cell ends up with the same four chromosomes.',
  note: 'Red and pink: one pair of homologous chromosomes (long). Blue and light blue: a second pair (short). Each condensed chromosome is two sister chromatids held at a centromere (white). Green lines: spindle microtubules.',
  rideLabel: 'Step through mitosis',
  theme: { bg: '#0d1418', panel: 'rgba(12,24,30,.86)', accent: '#7ae7c7', dim: '#c3d6dc', line: 'rgba(180,230,220,.22)' },
  fog: 0.006,
  build(A) {
    const { V, M, T, scene, THREE } = A;

    const nucs = [-1, 1].map(s => { const n = new THREE.Mesh(new THREE.SphereGeometry(4.5, 24, 18), T(0xa8dadc, 0.3)); n.position.x = s * 10; scene.add(n); return n; });
    const cents = [-1, 1].map(() => { const c = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 8), M(0xffd166, { emissive: 0x664400 })); scene.add(c); return c; });

        const cen = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8), M(0xffffff)); scene.add(cen);
        const rz = A.rnd(-0.6, 0.6);
        const K = [

          [b.x * 0.8 + s * 0.55, b.y * 0.8, b.z * 0.8, 0, 0, 0, rz, 0, 0.5, L],
          [s * 0.55, YS[i], ZS[i], 0, 0, 0, 0, 0, 0.5, L],
          [s * 6.5, YS[i] * 0.7, ZS[i], -s * L * 0.42, 0, 0, Math.PI / 2, 0, 0.5, L],
          [s * 10, YS[i] * 0.5, ZS[i] * 0.6, 0, 0, 0, r0[0], r0[1], 0.25, L * 1.5],
          [s * 10 + b.x * 0.4, b.y * 0.5, b.z * 0.5, 0, 0, 0, r0[0], r0[1], 0.13, L * 2.2]];

        c.cen.position.set(v[0], v[1], v[2]); c.g.position.set(v[0] + v[3], v[1] + v[4], v[2] + v[5]); c.g.rotation.set(v[7], 0, v[6]);
        c.body.scale.set(v[8], v[9], v[8]); c.c1.scale.setScalar(v[8]); c.c2.scale.setScalar(v[8]); c.c1.position.y = v[9] / 2; c.c2.position.y = -v[9] / 2; c.cen.scale.setScalar(Math.min(1, v[8] * 2)); });
      const spin = ph < 1 ? 0 : ph < 2 ? ph - 1 : ph < 4 ? 1 : Math.max(0, 5 - ph) * 0.8; spindle.material.opacity = 0.85 * spin; spindle.visible = spin > 0.02;

      outsideInfo: { n: 'Mitosis on a loop', s: 'In this view the cell runs through every phase over and over. Drag to turn it and watch the chromosomes line up and separate.', h: 'Mitosis gives two nuclei with identical chromosomes to the parent. It is used for growth, repair and asexual reproduction.', cs: 'D2.1.1, D2.1.4', ch: 'D2.1.12' },

    info.querySelector('h2').textContent=o.n; info.querySelector('p').textContent=o.s+(level==='hl'&&o.h?' '+o.h:''); if(o.cs) info.querySelector('.codes').textContent='Syllabus: '+o.cs+(level==='hl'&&o.ch?', '+o.ch:'');

  info.querySelector('p').textContent=s.s+(level==='hl'&&s.h?' '+s.h:''); info.querySelector('.codes').textContent='Syllabus: '+s.cs+(level==='hl'&&s.ch?', '+s.ch:'');

$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
$('b-pause').onclick=togglePause; $('b-help').onclick=()=>{ $('start').hidden=false; }; $('b-start').onclick=()=>{ $('start').hidden=true; canvas.focus(); };
window.addEventListener('keydown',e=>{ if(!$('start').hidden) return; if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); go(1); } else if(e.code==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.code==='KeyP') togglePause(); else if(e.code==='Escape'&&dive) closeDive(); });
