<script>
// Inside the Nucleus (2026-11-17, teacher's request: dive into the nucleus from Inside a Cell).
window.JOURNEY = {
  title: 'Inside the Nucleus',
  sub: 'DP Biology A2.2, A1.2 and D1.2 · simplified, not to scale',
  startTitle: 'The cell’s control centre',
  intro: 'Fly through a nuclear pore into the nucleus. See the double nuclear envelope, traffic through the pores, DNA wrapped round histones into nucleosomes, the nucleolus making ribosome parts, and chromatin coiling up into chromosomes before the cell divides.',
  note: 'DNA is drawn grey and the histone proteins purple. Orange strands are mRNA leaving; small blue blobs are ribosome subunits leaving; green blobs are proteins coming in. The nucleus is about 6 µm across; the nucleosomes are shown far larger than life.',
  rideLabel: 'Fly in',
  theme: { bg: '#100c1c', panel: 'rgba(20,14,34,.86)', accent: '#c77dff', dim: '#cdc2e0', line: 'rgba(220,200,255,.22)' },
  fog: 0.004,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const R = 34; const env = new THREE.Group(); scene.add(env);
    env.add(new THREE.Mesh(new THREE.SphereGeometry(R, 72, 48), T(0x9d7ad8, 0.16))); env.add(new THREE.Mesh(new THREE.SphereGeometry(R - 1.6, 72, 48), T(0xb79ae6, 0.12)));
    // pores: rings of eight subunits through both membranes
    const pores = []; const poreG = new THREE.SphereGeometry(0.8, 10, 8), poreM = M(0xe0c3fc, { roughness: 0.4 });
    for (let i = 0; i < 46; i++) { const u = (i + 0.5) / 46, th = Math.acos(1 - 2 * u), ph = i * 2.39996; const n = V(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)); const g = new THREE.Group(); g.position.copy(n.clone().multiplyScalar(R - 0.8)); g.lookAt(0, 0, 0); scene.add(g);
      for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; [-0.9, 0.9].forEach(z => { const m = new THREE.Mesh(poreG, poreM); m.position.set(Math.cos(a) * 2, Math.sin(a) * 2, z); g.add(m); }); } pores.push({ g, n }); }
    // ER joined to the outer membrane
    const er = M(0x8ecae6, { transparent: true, opacity: 0.55, side: THREE.DoubleSide }); for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(new THREE.TorusGeometry(R + 6 + k * 3.5, 0.9, 8, 60, 1.6), er); m.rotation.set(0.3, k * 0.2 - 0.3, 0.2); m.position.set(0, -4, 0); scene.add(m); }
    // nucleolus
    const nol = new THREE.Mesh(new THREE.SphereGeometry(8, 36, 26), M(0x5a189a, { roughness: 0.7 })); nol.position.set(6, -6, -4); scene.add(nol);
    // chromatin: a long fibre of nucleosomes wandering through the nucleus
    const pts = []; let p = V(-18, 10, 6); for (let i = 0; i < 60; i++) { pts.push(p.clone()); p.add(V(Math.sin(i * 0.7) * 4, Math.cos(i * 0.45) * 3.5, Math.sin(i * 0.33 + 1) * 3.5)); if (p.length() > R - 6) p.multiplyScalar((R - 8) / p.length()); }
    const fibre = new THREE.CatmullRomCurve3(pts); scene.add(new THREE.Mesh(new THREE.TubeGeometry(fibre, 600, 0.22, 6, false), M(0x8d99ae)));
    const hist = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.6, 0.6, 0.7, 14), M(0x9d4edd, { roughness: 0.4 }), 140); const dmy = new THREE.Object3D();
    for (let i = 0; i < 140; i++) { const u = i / 140, q = fibre.getPointAt(u), tg = fibre.getTangentAt(u); dmy.position.copy(q); dmy.quaternion.setFromUnitVectors(V(0, 1, 0), tg); dmy.updateMatrix(); hist.setMatrixAt(i, dmy.matrix); } scene.add(hist);
    // close-up nucleosome near the first stop: DNA wrapping a histone octamer 1.7 times, plus H1
    const NC = V(12, 17, 16); const oct = new THREE.Group(); oct.position.copy(NC); scene.add(oct);
    for (let k = 0; k < 8; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry(1.25, 16, 12), M(k % 2 ? 0x9d4edd : 0xb185db)); m.position.set(Math.cos(k / 4 * Math.PI) * 1.3, k < 4 ? 0.8 : -0.8, Math.sin(k / 4 * Math.PI) * 1.3); oct.add(m); }
    const wrap = []; for (let i = 0; i <= 120; i++) { const a = i / 120 * Math.PI * 2 * 1.7, y = -1.8 + i / 120 * 3.6; wrap.push(V(Math.cos(a) * 3.3, y, Math.sin(a) * 3.3)); }
    wrap.unshift(V(-8, -2.6, 3)); wrap.push(V(8, 2.6, -3)); oct.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wrap), 300, 0.55, 8, false), M(0x6c757d, { roughness: 0.4 })));
    const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), M(0xff8fab)); h1.position.set(0, 0, 3.8); oct.add(h1);
    // a condensed chromosome (two sister chromatids) for the last stop
    const chrom = new THREE.Group(); chrom.position.set(-8, -16, 12); scene.add(chrom); const chM = M(0x7b2cbf, { roughness: 0.5 });
    [-1, 1].forEach(s => { const c = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 12, 16), chM); c.position.x = s * 1.2; c.rotation.z = s * 0.15; chrom.add(c); [6, -6].forEach(y => { const e = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 10), chM); e.position.set(s * 1.2 - s * 0.15 * y * 0.15, y, 0); chrom.add(e); }); });
    // traffic through pores: mRNA out, ribosome subunits out, proteins in
    const tr = []; const kinds = [[0xff9f1c, 'm'], [0x8ecae6, 'r'], [0x80ed99, 'p']];
    for (let i = 0; i < 24; i++) { const k = kinds[i % 3]; let m; if (k[1] === 'm') { m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(0, 0, -2), V(0.6, 0.4, 0), V(-0.4, 0.2, 2)]), 12, 0.25, 6, false), M(k[0])); } else m = new THREE.Mesh(new THREE.SphereGeometry(k[1] === 'r' ? 1.1 : 0.8, 12, 10), M(k[0]));
      scene.add(m); tr.push({ m, kind: k[1], pore: pores[(i * 7) % pores.length], u: Math.random() }); }
    const L = (t, p, far) => A.label(t, p, far || 90);
    L('Nuclear envelope (double membrane)', V(-24, 26, 10), 160); L('Nuclear pore', pores[3].n.clone().multiplyScalar(R + 3), 160); L('Rough ER (joined to the envelope)', V(30, -20, 26), 200);
    L('Nucleolus', V(6, 4, -4)); L('Chromatin', V(-6, 12, 0)); L('Nucleosome', NC.clone().add(V(0, 5, 0))); L('Histone proteins', NC.clone().add(V(4.5, -2, 2))); L('DNA', NC.clone().add(V(-6, -3.5, 2))); L('Chromosome (condensed before division)', V(-8, -7, 12));
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 4), M(0xffffff)); hero.visible = false; scene.add(hero);
    const pIn = pores[3].n; const cams = [pIn.clone().multiplyScalar(R + 40).add(V(10, 10, 0)), pIn.clone().multiplyScalar(R + 8), pIn.clone().multiplyScalar(R - 10), NC.clone().add(V(3, 2, 9)), V(6, 6, 18), V(-2, 4, 20), V(-8, -12, 26)];
    return {
      route: cams, hero, camOffset: V(0, 0, 0), outside: { target: V(0, 0, 0), dist: 110 },
      outsideInfo: { n: 'The nucleus', s: 'Drag to turn the nucleus. Pores dot the double membrane, and rough ER is joined to the outer membrane.', cs: 'A2.2.6' },
      stops: [
        { at: cams[0], look: V(0, 0, 0), n: 'The nucleus', s: 'The nucleus holds the cell’s DNA and controls its activities by deciding which genes are expressed. It is the largest organelle in most animal cells.', h: 'Keeping DNA inside a nucleus separates transcription from translation, so mRNA can be modified before it reaches ribosomes.', cs: 'A2.2.6', ch: 'B2.2.2, D1.2.15' },
        { at: cams[1], look: pIn.clone().multiplyScalar(R), n: 'The nuclear envelope', s: 'The nucleus is surrounded by a double membrane, the nuclear envelope. The outer membrane is continuous with the rough endoplasmic reticulum.', cs: 'A2.2.6', ch: 'B2.2.6' },
        { at: cams[2], look: pIn.clone().multiplyScalar(R), n: 'Nuclear pores', s: 'Thousands of pores cross the envelope. mRNA and ribosome subunits leave through them; proteins needed inside, such as RNA and DNA polymerases and histones, come in.', h: 'Each pore is a large protein complex that controls which molecules pass, so the pores are selective, not open holes.', cs: 'A2.2.6', ch: 'B2.2.6' },
        { at: cams[3], look: NC, n: 'DNA wrapped round histones', s: 'In eukaryotes DNA is wound round proteins called histones. Wrapping lets about 2 metres of DNA fit inside a nucleus only a few micrometres across.', h: 'A nucleosome is eight histone proteins with DNA wrapped round them about 1.7 times, held by a ninth histone (H1). Nucleosomes are linked by short lengths of DNA, like beads on a string.', cs: 'A2.2.6', ch: 'A1.2.13' },
        { at: cams[4], look: nol.position, n: 'The nucleolus', s: 'The nucleolus is a dense region where the RNA of ribosomes is made and joined to proteins. The ribosome subunits then leave through the pores.', cs: 'A2.2.6' },
        { at: cams[5], look: V(-6, 8, 0), n: 'Genes are copied here', s: 'Genes are transcribed into mRNA inside the nucleus, and the whole DNA is replicated here before a cell divides. The Transcription and Copying DNA walk-throughs show both processes up close.', cs: 'D1.2.1, D1.1.1' },
        { at: cams[6], look: chrom.position, n: 'Chromosomes', s: 'Before mitosis or meiosis, the replicated DNA coils up much more tightly into visible chromosomes, each made of two identical sister chromatids joined at a centromere. Condensed chromosomes can be moved without tangling.', cs: 'D2.1.6', ch: 'D2.1.5' }
      ],
      update(dt, A) { const run = A.paused ? 0 : dt;
        tr.forEach(o => { o.u = (o.u + run * 0.18) % 1; const n = o.pore.n; const out = o.kind !== 'p'; const r = out ? R - 10 + o.u * 22 : R + 12 - o.u * 22; o.m.position.copy(n.clone().multiplyScalar(r)); o.m.rotation.y += run; });
        oct.rotation.y += run * 0.2; chrom.rotation.y += run * 0.3; nol.rotation.y += run * 0.1; }
    };
  }
};

// Extras for the nucleus (2026-11-18): a stop on the nuclear envelope (B2.2.2, B2.2.6), check questions, SL close-ups on stem
