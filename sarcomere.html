<script>
// Inside a Muscle (rebuilt 2026-11-17 after the teacher's feedback: explain structure step by step from muscle to
// sarcomere, clickable labels with definitions, and a clear, slow cross-bridge cycle). Old version: old\sarcomere.v1.js.
window.JOURNEY = {
  title: 'Inside a Muscle',
  sub: 'DP Biology B3.3 (HL) · simplified, not to scale',
  startTitle: 'From a whole muscle to the cross-bridge',
  intro: 'Zoom in one level at a time: a whole muscle, a bundle of fibres, one muscle fibre, a myofibril and finally one sarcomere. Watch the sarcomere contract, then open the close-ups to see each step of the cross-bridge cycle and how a nerve impulse starts it. Click any label marked with an i to read what it is.',
  note: 'Red beads: actin. Purple: myosin and its heads (yellow when attached to actin). Blue: tropomyosin. Yellow blobs: troponin. Green: calcium ions. Grey springs: titin. Each level is magnified far more than the one before.',
  rideLabel: 'Zoom in',
  theme: { bg: '#170d14', panel: 'rgba(30,14,24,.88)', accent: '#ff9fb2', dim: '#d6bcc9', line: 'rgba(255,200,220,.22)' },
  fog: 0.0022,
  glossary: {
    'Whole muscle': 'An organ made of many bundles of muscle fibres, wrapped in connective tissue, with blood vessels and nerves. It can only pull (contract), never push.',
    'Tendon': 'Tough, non-stretchy connective tissue that joins a muscle to a bone, so the pull of the muscle moves the bone.',
    'Fascicle (bundle of fibres)': 'A bundle of muscle fibres wrapped in connective tissue. A whole muscle is made of many fascicles.',
    'Fascicle': 'A bundle of muscle fibres wrapped in its own layer of connective tissue.',
    'Muscle fibre': 'One muscle cell: very long, with many nuclei, packed with myofibrils. It forms when many cells fuse during development.',
    'Blood capillary': 'Tiny vessels between the fibres that bring oxygen and glucose for respiration and take away carbon dioxide.',
    'Sarcolemma': 'The cell surface membrane of a muscle fibre. A nerve impulse spreads along it and down into the T-tubules.',
    'Nucleus (one of many)': 'Muscle fibres have many nuclei, pushed to the edge of the cell, because each fibre forms from many fused cells.',
    'Myofibril': 'A long rod of protein filaments running the length of the fibre. It is divided into repeating sarcomeres, which give the striped look.',
    'Mitochondrion': 'Muscle fibres have many mitochondria between the myofibrils. Aerobic respiration in them makes the ATP that contraction uses.',
    'Sarcoplasmic reticulum': 'A network of membrane sacs around each myofibril (a specialised ER). It stores calcium ions and releases them when a nerve impulse arrives.',
    'T-tubule': 'An infolding of the sarcolemma that carries the impulse deep into the fibre, next to the sarcoplasmic reticulum.',
    'Z line': 'The boundary at each end of a sarcomere. Thin actin filaments are anchored to it. Z lines move closer together when the muscle contracts.',
    'I band (light)': 'The light band: the part with only thin actin filaments. It gets shorter when the muscle contracts.',
    'A band (dark)': 'The dark band: the full length of the thick myosin filaments. It stays the same length during contraction.',
    'H zone': 'The middle of the A band where there is myosin but no actin. It gets shorter, and can disappear, when the muscle contracts.',
    'M line': 'The line in the centre of the sarcomere that holds the thick myosin filaments in place.',
    'One sarcomere': 'The unit of contraction: the section of myofibril from one Z line to the next. Thousands shortening together make the whole muscle shorten.',
    'Actin (thin filament)': 'A thin filament made of two twisted chains of actin proteins, anchored to the Z line. Each actin protein has a binding site for a myosin head.',
    'Myosin (thick filament)': 'A thick filament made of many myosin proteins. Their heads stick out and can bind to actin, forming cross-bridges.',
    'Myosin heads': 'The parts of myosin that bind to actin and swivel to pull it. Each head uses one ATP per cycle.',
    'Myosin head': 'Binds to a site on actin, swivels to pull the actin (the power stroke), lets go when ATP binds, and is re-cocked when it splits ATP.',
    'Titin': 'A huge, springy protein joining the thick filament to the Z line. It is stretched when the sarcomere is pulled longer and helps it spring back, and stops it being over-stretched.',
    'Tropomyosin': 'A long protein that lies along the actin filament and covers the myosin binding sites when the muscle is relaxed.',
    'Troponin': 'A protein attached to tropomyosin. When calcium ions bind to it, it changes shape and pulls tropomyosin off the binding sites.',
    'Calcium ions': 'Released from the sarcoplasmic reticulum when a nerve impulse arrives. They bind to troponin, which uncovers the binding sites on actin.',
    'Binding site': 'The place on an actin protein where a myosin head can attach. It is covered by tropomyosin until calcium ions arrive.',
    'Ca²⁺': 'Calcium ions. They bind to troponin, which moves tropomyosin and uncovers the binding sites on actin.',
    'ATP': 'Binds to the myosin head and makes it let go of actin. The head then splits ATP into ADP and phosphate, which re-cocks it.',
    'ADP + Pi': 'What is left after the myosin head splits ATP. The head holds them while cocked; releasing them goes with the power stroke.',
    'Motor neuron': 'A nerve cell that carries impulses from the spinal cord or brain to muscle fibres.',
    'Motor unit': 'One motor neuron and all the muscle fibres it controls. They all contract together. More units switched on gives a stronger pull.',
    'Motor end plate': 'Where the motor neuron meets the muscle fibre: a synapse between nerve and muscle.',
    'Acetylcholine': 'The neurotransmitter released by the motor neuron. It binds to receptors on the sarcolemma and starts an impulse in the muscle fibre.',
    'Receptors': 'Proteins in the sarcolemma that acetylcholine binds to, opening channels so the fibre membrane is depolarised.',
    'Synaptic vesicles': 'Small sacs in the motor neuron ending, full of acetylcholine, released by exocytosis when an impulse arrives.'
  },
  build(A) {

    const tendon = along(new THREE.Mesh(new THREE.CylinderGeometry(4, 4.6, 40, 24), M(0xf1ece2, { roughness: 0.35 })), MU.x - 118); scene.add(tendon);
    const face = new THREE.Mesh(new THREE.CircleGeometry(38, 64), M(0xf0d2c8, { side: THREE.DoubleSide })); face.rotation.y = Math.PI / 2; face.position.set(MU.x + 0.05, 0, 0); scene.add(face);
    const fasPos = [[0, 0, 7]]; for (let i = 0; i < 6; i++) fasPos.push([Math.cos(i / 6 * 6.283) * 14.5, Math.sin(i / 6 * 6.283) * 14.5, 6.6]); for (let i = 0; i < 11; i++) fasPos.push([Math.cos((i + 0.5) / 11 * 6.283) * 28.5, Math.sin((i + 0.5) / 11 * 6.283) * 28.5, 6.2]);
    const fasM = M(0xc8404f, { roughness: 0.55 });
    fasPos.forEach(([y, z, r]) => { const c = along(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 2, 28), fasM), MU.x); c.position.set(MU.x + 0.6, y, z); scene.add(c); });
    L('Whole muscle', V(MU.x - 60, 42, 0), 600); D('Tendon', V(MU.x - 128, 9, 0), 600); D('Fascicle (bundle of fibres)', V(MU.x + 2, 14.5, 4), 600);

    // ===== 2. One fascicle (bundle of fibres), x -235 to -165 =====
    const FA = V(-200, 0, 0);
    scene.add(along(new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 70, 40, 1, true), T(0xf3d5cd, 0.22)), FA.x));
    const fibM = M(0xc23b4c, { roughness: 0.5 }), fibEnd = M(0xe58a96);
    [[0, 0]].concat([0, 1, 2, 3, 4, 5].map(i => [Math.cos(i * 1.047) * 8.6, Math.sin(i * 1.047) * 8.6])).forEach(([y, z]) => {
      const f = along(new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 76, 24), fibM)); f.position.set(FA.x + 3, y, z); scene.add(f);
      const e = new THREE.Mesh(new THREE.CircleGeometry(3.9, 24), fibEnd); e.rotation.y = Math.PI / 2; e.position.set(FA.x + 41.05, y, z); scene.add(e); });
    scene.add(tube([V(-240, 13, 8), V(-215, 15.5, 4), V(-190, 14, 9), V(-165, 15.8, 3)], 0.7, M(0xd62828, { emissive: 0x330000 }), 40));

    // ===== 3. One muscle fibre (cell), x -145 to -75, cut open at x = -75 =====
    const FI = V(-110, 0, 0);
    scene.add(along(new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 70, 48, 1, true), T(0xd94f63, 0.2)), FI.x));
    const nucM = M(0x5b2a86, { roughness: 0.4 });
    [[-135, 0.5], [-118, 2.4], [-100, 4.2], [-88, 1.2]].forEach(([x, a]) => { const n = new THREE.Mesh(new THREE.SphereGeometry(1.6, 18, 12), nucM); n.scale.set(2.6, 0.7, 1.2); n.position.set(x, Math.cos(a) * 9.4, Math.sin(a) * 9.4); n.lookAt(x, 0, 0); n.rotateY(Math.PI / 2); scene.add(n); });
    const mfPos = [[0, 0]]; for (let i = 0; i < 6; i++) mfPos.push([Math.cos(i * 1.047) * 4.3, Math.sin(i * 1.047) * 4.3]); for (let i = 0; i < 9; i++) mfPos.push([Math.cos(i * 0.698 + 0.3) * 7.6, Math.sin(i * 0.698 + 0.3) * 7.6]);
    const mfM = M(0xf0a3b2, { roughness: 0.5 }); const bandG = new THREE.CylinderGeometry(1.86, 1.86, 2.6, 18, 1, true); const bands = new THREE.InstancedMesh(bandG, M(0x7a1f35), mfPos.length * 14); const dm = new THREE.Object3D(); let bi = 0;
    mfPos.forEach(([y, z]) => { const m = along(new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 70, 18), mfM), FI.x); m.position.y = y; m.position.z = z; scene.add(m);
      for (let x = -143; x < -76; x += 5) { dm.position.set(x, y, z); dm.rotation.set(0, 0, Math.PI / 2); dm.updateMatrix(); bands.setMatrixAt(bi++, dm.matrix); } });
    bands.count = bi; scene.add(bands);
    const mitM = M(0xe76f51, { roughness: 0.5 }); [[-130, 2.1, 2.6], [-120, -2.2, 6], [-108, 6, -2.4], [-96, -6, 2.2], [-86, 2.4, -6.1], [-126, -6.2, -3]].forEach(([x, y, z]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 8), mitM); m.scale.set(2.4, 1, 1); m.position.set(x, y, z); scene.add(m); });
