<script>
// Journey Through the Heart, rebuilt 2026-11-17 (teacher: the old heart did not look like a heart and the red blood
// cells were unclear). Anatomical outer shape with grooves, fat, auricles, great vessels and coronary arteries;
// biconcave red blood cells; six close-ups (chambers and valves, valves in action, cardiac muscle, vessels,
// a red blood cell, a blocked coronary artery). Simplified and not to scale.
window.JOURNEY = {
  title: 'Journey Through the Heart',
  sub: 'DP Biology B3.2 · simplified, not to scale',
  startTitle: 'Ride through the heart',
  intro: 'Travel with one red blood cell on its double circuit: in from the body, through the right side of the heart to the lungs, back to the left side and out to the body. At each stop, use Zoom in to open a close-up: the four chambers cut open, the valves working, cardiac muscle, blood vessels, a red blood cell and a blocked coronary artery.',
  note: 'Outside view shows the whole heart from the front: turn it to see the coronary arteries. The heartbeat is slowed down so you can follow each valve. Blue is used for deoxygenated blood by convention; real deoxygenated blood is dark red.',
  rideLabel: 'Ride with a blood cell',
  theme: { bg: '#16070c', panel: 'rgba(30,10,16,.86)', accent: '#ffd166', dim: '#d8b4ad', line: 'rgba(255,190,180,.22)' },
  fog: 0.005,
  glossary: {
    "Right atrium": "Receives deoxygenated blood from the body through the venae cavae and passes it to the right ventricle.",
    "Left atrium": "Receives oxygenated blood from the lungs through the pulmonary veins and passes it to the left ventricle.",
    "Atrium": "An upper chamber of the heart. Its thin wall only needs to push blood a short way, into the ventricle below.",
    "Right ventricle": "Pumps deoxygenated blood to the lungs through the pulmonary artery. Its wall is thinner than the left ventricle's because the lungs are close.",
    "Left ventricle": "Pumps oxygenated blood through the aorta to the whole body, so it has the thickest, most muscular wall.",
    "Ventricle": "A lower, thick-walled chamber that pumps blood out of the heart into an artery.",
    "Septum": "The wall between the left and right sides of the heart, which keeps oxygenated and deoxygenated blood apart.",
    "Aorta": "The largest artery. It carries oxygenated blood from the left ventricle to the body.",
    "Pulmonary artery": "Carries deoxygenated blood from the right ventricle to the lungs.",
    "Pulmonary veins": "Carry oxygenated blood from the lungs back to the left atrium.",
    "Superior vena cava": "Brings deoxygenated blood from the head and arms back to the right atrium.",
    "Inferior vena cava": "Brings deoxygenated blood from the lower body back to the right atrium.",
    "Tricuspid valve": "The atrioventricular valve on the right side. It stops blood flowing back from the right ventricle into the right atrium.",
    "Bicuspid valve": "The atrioventricular valve on the left side (also called the mitral valve). It stops backflow from the left ventricle into the left atrium.",
    "AV valve flaps": "The flaps of the atrioventricular valves. They are pushed shut when the ventricles contract.",
    "Aortic valve": "A semilunar valve at the start of the aorta. It stops blood flowing back into the left ventricle.",
    "Pulmonary valve": "A semilunar valve at the start of the pulmonary artery. It stops blood flowing back into the right ventricle.",
    "Pocket-shaped cusps": "The cusps of the semilunar valves fill with blood and close when the ventricles relax, stopping backflow.",
    "Chordae tendineae": "Tendon-like cords that hold the AV valve flaps so they cannot turn inside out when the ventricles contract.",
    "Papillary muscle": "Small muscles in the ventricle wall that pull on the chordae tendineae as the ventricle contracts.",
    "Sinoatrial node": "The heart's pacemaker: a patch of cells in the right atrium that starts each heartbeat with an electrical signal.",
    "Atrioventricular node": "Delays the signal from the atria briefly, so the atria finish emptying before the ventricles contract.",
    "Coronary artery": "Supplies the heart muscle itself with oxygen and glucose. A blockage here causes a heart attack.",
    "Thick muscular wall": "Cardiac muscle that contracts to pump blood. It is thickest where the blood must be pushed furthest.",
    "Heart muscle": "Cardiac muscle: branched, striated cells joined by intercalated discs, which contract without tiring.",
    "Intercalated disc": "Junctions joining cardiac muscle cells, with gaps that let the electrical signal pass quickly from cell to cell.",
    "Mitochondria": "Cardiac muscle has many mitochondria to make the large amount of ATP it needs for constant contraction.",
    "Artery": "Carries blood away from the heart at high pressure. It has a thick wall of muscle and elastic fibres and a narrow lumen.",
    "Vein": "Carries blood back to the heart at low pressure. It has a thin wall, a wide lumen and pocket valves.",
    "Capillary": "The smallest vessel. Its wall is one cell thick, so substances exchange quickly between the blood and the tissues.",
    "Pocket valve": "A valve in a vein that stops low-pressure blood flowing backwards.",
    "Haemoglobin": "The protein in red blood cells that binds oxygen in the lungs and releases it in respiring tissues.",
    "Plaque (fatty deposit)": "A build-up of fat and cholesterol in an artery wall that narrows the lumen (atherosclerosis).",
    "Blood clot": "If a plaque breaks open, a clot can form on it and block the artery completely."
  },
  build(A) {
    const { V, M, T, THREE, scene } = A;
    const PERIOD = A.reduceMotion ? 6 : 3.2;
    // ---------- shared pieces ----------
    // Red blood cell: biconcave disc from the Evans-Fung shape equation, turned on a lathe
    function rbcGeo(R, seg) { const pts = []; const n = 22;
      const z = r => 0.5 * R * Math.sqrt(Math.max(0, 1 - (r / R) * (r / R))) * (0.207 + 2.003 * (r / R) ** 2 - 1.123 * (r / R) ** 4);
      for (let i = 0; i <= n; i++) { const r = R * Math.sin(i / n * Math.PI / 2); pts.push(new THREE.Vector2(Math.max(0.001, r), z(r) * 1.5 + 0.02 * R)); }
      for (let i = n; i >= 0; i--) { const r = R * Math.sin(i / n * Math.PI / 2); pts.push(new THREE.Vector2(Math.max(0.001, r), -z(r) * 1.5 - 0.02 * R)); }
      return new THREE.LatheGeometry(pts, seg || 28); }
    const OXY = 0xc8102e, DEOXY = 0x6b1f52;
    const rbcMat = c => M(c, { roughness: 0.38, metalness: 0.0, emissive: c, emissiveIntensity: 0.12 });
    function phaseAt(f) { if (f < 0.14) return 0; if (f < 0.20) return 1; if (f < 0.44) return 2; if (f < 0.50) return 3; return 4; }
    const PHASES = [['Atrial systole', 'Atria contract. AV valves open, semilunar valves shut.'], ['Ventricles start to contract', 'All four valves shut: pressure in the ventricles builds.'], ['Ventricular systole', 'Semilunar valves open: blood is pumped into the arteries. AV valves shut.'], ['Ventricles relax', 'All four valves shut again as pressure falls.'], ['Diastole', 'Heart muscle relaxes and the chambers fill. AV valves open.']];
    function pressures(f) { const la = f < 0.14 ? 1.2 + 0.8 * Math.sin(f / 0.14 * Math.PI) : 0.6 + 0.8 * Math.min(1, (f - 0.2) / 0.8);
      const lv = f < 0.14 ? 1.0 + 0.6 * f / 0.14 : f < 0.20 ? 1.6 + 9 * (f - 0.14) / 0.06 : f < 0.44 ? 10.6 + 5.4 * Math.sin((f - 0.2) / 0.24 * Math.PI) - ((f - 0.2) / 0.24) * 1.5 : f < 0.5 ? 9 - 8 * (f - 0.44) / 0.06 : 0.6;
      const ao = f < 0.20 ? 10.6 - 1.2 * (f / 0.2) : f < 0.44 ? Math.max(10.6, lv) : 10.6 + 3 - ((f - 0.44) / 0.56) * 3.6; return { la, lv, ao }; }
    // Soft value noise for natural-looking surfaces
    const nz = (x, y, z) => Math.sin(x * 1.7 + Math.sin(y * 2.3)) * Math.cos(y * 1.3 + Math.sin(z * 1.9)) * Math.sin(z * 2.1 + x * 0.7);
    function colourise(g, fn) { const p = g.attributes.position, c = new Float32Array(p.count * 3), col = new THREE.Color(); for (let i = 0; i < p.count; i++) { fn(p.getX(i), p.getY(i), p.getZ(i), col, i); c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b; } g.setAttribute('color', new THREE.BufferAttribute(c, 3)); }
    function bumpy(g, amt, f) { const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i); const k = 1 + amt * nz(x * f, y * f, z * f); p.setXYZ(i, x * k, y * k, z * k); } g.computeVertexNormals(); }

    // ---------- the outer heart ----------
    const outer = new THREE.Group(); scene.add(outer); const shellMats = [];
    const muscleCol = new THREE.Color(0x8d2a28), fatCol = new THREE.Color(0xe2c17c), darkCol = new THREE.Color(0x6a1c1c);
    const shellMat = o => { const m = new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.42, metalness: 0.04 }, o || {})); shellMats.push(m); return m; };
    // Ventricles: a blunt cone, flattened front to back, with grooves where the coronary arteries run in fat
    const VR = 35, VH = 33; const vent = new THREE.Group(); vent.position.set(2, -11, 2); vent.rotation.z = 0.36; outer.add(vent);
    const phi0 = s => 0.12 + 0.42 * (1 - s); // anterior interventricular groove: front, drifting left towards the apex
    function ventShape(px, py, pz) { const y = py, s = (y + 1) / 2, phi = Math.atan2(px, pz);
      let w = 0.12 + 0.88 * Math.pow(s, 0.68); if (s > 0.68) w *= 1 - 0.55 * ((s - 0.68) / 0.32) ** 2;
      let dp = phi - phi0(s); dp = Math.atan2(Math.sin(dp), Math.cos(dp));
      const g1 = s < 0.78 ? 0.06 * Math.exp(-dp * dp / 0.01) : 0, g2 = 0.05 * Math.exp(-((s - 0.74) ** 2) / 0.0012);
      const k = (1 - g1 - g2) * (1 + 0.012 * nz(px * 6, py * 6, pz * 6));
      return { x: px * w * VR * k, y: y * VH, z: pz * w * VR * 0.8 * k, fat: Math.min(1, (g1 + g2) * 14 + (s > 0.7 ? 0.25 : 0)), s }; }
    { const g = new THREE.SphereGeometry(1, 120, 90); const p = g.attributes.position; const fat = [];
      for (let i = 0; i < p.count; i++) { const r = ventShape(p.getX(i), p.getY(i), p.getZ(i)); p.setXYZ(i, r.x, r.y, r.z); fat.push(r.fat); }
      g.computeVertexNormals(); colourise(g, (x, y, z, c, i) => { c.copy(muscleCol).lerp(darkCol, 0.3 + 0.3 * nz(x * 0.3, y * 0.3, z * 0.3)).lerp(fatCol, fat[i] * (0.75 + 0.25 * nz(x, y, z))); });
