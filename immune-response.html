<script>
window.JOURNEY = {
  title: 'Fighting an Infection',
  sub: 'DP Biology C3.2 · simplified, not to scale',
  startTitle: 'From a cut to immunity',
  intro: 'Follow bacteria through a cut in the skin and watch the body respond: a clot seals the wound, phagocytes engulf the invaders, helper T-cells activate a B-cell, plasma cells pour out antibodies and memory cells stay behind.',
  note: 'Green capsules: bacteria. Red discs: red blood cells; small pink discs: platelets; pale threads: fibrin. Blue: helper T-cell. Orange: B-cell and its clones (plasma cells). Yellow Y shapes: antibodies. Purple: memory cells.',
  rideLabel: 'Follow the infection',
  theme: { bg: '#1a0d12', panel: 'rgba(34,14,22,.86)', accent: '#ff8fab', dim: '#e2c6cf', line: 'rgba(255,200,215,.22)' },
  fog: 0.004,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    // Skin with a cut
    const skinM = M(0xe0a98a, { roughness: 0.8 });
    [[-86, -63], [-57, -34]].forEach(([a, b]) => { const s = new THREE.Mesh(new THREE.BoxGeometry(b - a, 6, 30), skinM); s.position.set((a + b) / 2, 11, 0); scene.add(s); const top = new THREE.Mesh(new THREE.BoxGeometry(b - a, 1.2, 30), M(0xc98b6b)); top.position.set((a + b) / 2, 14.6, 0); scene.add(top); });
    const mucus = new THREE.Mesh(new THREE.BoxGeometry(22, 1.4, 30), T(0xbde0fe, 0.5)); mucus.position.set(-75, 15.8, 0); scene.add(mucus);
    // Tissue fluid floor
    const floor = new THREE.Mesh(new THREE.BoxGeometry(200, 1, 40), T(0x6d1a36, 0.35)); floor.position.set(0, -20, 0); scene.add(floor);
    // Clot in the cut: platelets, fibrin, trapped red cells
    const plats = []; for (let i = 0; i < 18; i++) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.3, 10), M(0xff8fab)); p.position.set(-60 + A.rnd(-2.5, 2.5), A.rnd(8, 14), A.rnd(-8, 8)); p.rotation.set(A.rnd(0, 3), 0, A.rnd(0, 3)); scene.add(p); plats.push({ m: p, b: p.position.clone(), k: A.rnd(0, 6) }); }
    const fibM = M(0xfff1e6); for (let i = 0; i < 14; i++) scene.add(tube([V(-63, A.rnd(8, 14), A.rnd(-9, 9)), V(-60, A.rnd(8, 14), A.rnd(-9, 9)), V(-57, A.rnd(8, 14), A.rnd(-9, 9))], 0.12, fibM, 12));
    for (let i = 0; i < 6; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.55, 8, 16), M(0xc1121f)); r.position.set(-60 + A.rnd(-2, 2), A.rnd(9, 13), A.rnd(-7, 7)); r.rotation.set(A.rnd(0, 3), A.rnd(0, 3), 0); scene.add(r); }
    // Bacteria
    const bactG = new THREE.CylinderGeometry(0.6, 0.6, 2, 10); const bactM = M(0x7cb518, { roughness: 0.5 });
    function bacterium() { const g = new THREE.Group(); const b = new THREE.Mesh(bactG, bactM); g.add(b); [1, -1].forEach(s => { const c = new THREE.Mesh(new THREE.SphereGeometry(0.6, 10, 8), bactM); c.position.y = s; g.add(c); }); for (let i = 0; i < 6; i++) { const a = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 4), M(0xffd60a, { emissive: 0x554400 })); a.position.set(Math.cos(i) * 0.7, (i / 3 - 1), Math.sin(i) * 0.7); g.add(a); } scene.add(g); return g; }
    const bPath = new THREE.CatmullRomCurve3([V(-60, 22, 0), V(-60, 6, 0), V(-40, -4, 2), V(-18, -8, 0), V(-6, -9, 0), V(0, -9, 0)]);
    const bact = Array.from({ length: 16 }, () => ({ m: bacterium(), u: Math.random(), o: A.onSphere(A.rnd(0, 2)) }));
    // Phagocyte with lobed nucleus and pseudopodia
    const phago = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 24), T(0xcdb4db, 0.45)); phago.position.set(0, -9, 0); scene.add(phago);
    for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 12), M(0x5a189a)); l.position.set(-2 + i * 1.8, -8 + (i % 2) * 1.2, 0); phago.parent.add(l); }
    const pseudo = [0, 1].map(s => { const p = new THREE.Mesh(new THREE.SphereGeometry(2.6, 16, 12), T(0xcdb4db, 0.45)); p.position.set(-6.5, -9 + (s ? 3 : -3), 0); scene.add(p); return p; });
    // Lymph node: helper T-cell activates a B-cell
    const node = new THREE.Mesh(new THREE.SphereGeometry(16, 32, 24), T(0x8ecae6, 0.1)); node.position.set(32, -6, 0); scene.add(node);
    const tCell = new THREE.Mesh(new THREE.SphereGeometry(3.2, 24, 18), M(0x4361ee)); tCell.position.set(26, -6, 0); scene.add(tCell);
    const bCell = new THREE.Mesh(new THREE.SphereGeometry(3.2, 24, 18), M(0xf77f00)); bCell.position.set(37, -6, 0); scene.add(bCell);
    const ag = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), M(0xffd60a, { emissive: 0x665500 })); ag.position.set(31.5, -6, 0); scene.add(ag);
    const sig = Array.from({ length: 6 }, () => ({ m: new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 4), M(0x90e0ef, { emissive: 0x2277aa })), u: Math.random() })); sig.forEach(s => scene.add(s.m));
    // Plasma cell clones and antibodies
    function antibody(col) { const g = new THREE.Group(); const m = M(col, { emissive: 0x332200 }); const st = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.4, 6), m); st.position.y = -0.7; g.add(st); [-0.6, 0.6].forEach(a => { const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.2, 6), m); arm.position.set(Math.sin(a) * 0.6, 0.5, 0); arm.rotation.z = -a; g.add(arm); }); scene.add(g); return g; }
    const plasma = []; for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(2.8, 20, 16), M(0xfcbf49)); p.position.set(56 + (i % 3) * 7, -12 + Math.floor(i / 3) * 8, A.rnd(-4, 4)); scene.add(p); plasma.push(p); }
    const target = V(84, -2, 0); const cluster = []; for (let i = 0; i < 5; i++) { const b = bacterium(); b.position.copy(target).add(A.onSphere(2.5)); b.rotation.set(A.rnd(0, 3), A.rnd(0, 3), 0); cluster.push(b); }
    const abs = Array.from({ length: 30 }, (_, i) => ({ m: antibody(0xffd166), u: Math.random(), from: plasma[i % 6].position, o: A.onSphere(A.rnd(1.5, 3.5)) }));
    // Memory cells
    const mem = []; for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(2.4, 20, 16), M(0x9d4edd, { emissive: 0x2a0a44 })); m.position.set(98 + (i % 2) * 6, -8 + Math.floor(i / 2) * 6, A.rnd(-3, 3)); scene.add(m); mem.push(m); }
    A.label('Skin', V(-78, 18, 8)); A.label('Mucus', V(-75, 20, -6)); A.label('Cut sealed by a clot', V(-60, 20, 6)); A.label('Bacteria', V(-40, 0, 6)); A.label('Phagocyte', V(0, 0, 0)); A.label('Lymph node', V(32, 12, 0), 400); A.label('Helper T-cell', V(26, -1, 2)); A.label('B-cell', V(37, -1, 2)); A.label('Antigen', V(31.5, -9.5, 2)); A.label('Plasma cells (clones)', V(63, 2, 0)); A.label('Antibodies on bacteria', V(84, 4, 0)); A.label('Memory cells', V(101, 2, 0));
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    return {
      route: [V(-100, 40, 50), V(-78, 26, 30), V(-60, 22, 26), V(-14, 2, 26), V(31, 4, 24), V(63, 2, 34), V(84, 6, 22), V(101, 4, 24)], hero, camOffset: V(0, 0, 0), outside: { target: V(10, -2, 0), dist: 170 },
      outsideInfo: { n: 'Defending the body', s: 'The body has three lines of defence: barriers that keep pathogens out, innate cells such as phagocytes that attack any invader, and adaptive lymphocytes that make antibodies against one particular pathogen.', h: 'The innate response is fast but the same every time. The adaptive response is slower the first time but specific, and it leaves memory cells so a second infection is stopped quickly.', cs: 'C3.2.1, C3.2.4', ch: '' },
      stops: [
        { at: V(-78, 26, 30), look: V(-75, 12, 0), n: 'Skin and mucous membranes', s: 'Unbroken skin is a tough, dry barrier that most pathogens cannot cross. Mucous membranes in the airways trap pathogens in sticky mucus.', h: 'The outer skin cells are dead and full of keratin; skin secretions are slightly acidic and contain enzymes, which slow bacterial growth.', cs: 'C3.2.1, C3.2.2', ch: '' },
        { at: V(-60, 22, 26), look: V(-60, 11, 0), n: 'A clot seals the cut', s: 'When the skin is cut, platelets stick together at the wound. Threads of fibrin form a mesh that traps red blood cells, making a clot that stops bleeding and keeps more pathogens out.', h: 'Damaged tissue and platelets release clotting factors, starting a cascade: prothrombin is converted to thrombin, which turns soluble fibrinogen into insoluble fibrin.', cs: 'C3.2.3', ch: '' },
        { at: V(-14, 2, 26), look: V(-2, -9, 0), n: 'Phagocytes engulf bacteria', s: 'Bacteria that get in are found by phagocytes. A phagocyte wraps around a bacterium (endocytosis) and digests it with enzymes from its lysosomes.', h: 'This is part of the innate system: phagocytes respond to any pathogen in the same way, and they gather where tissue is infected.', cs: 'C3.2.4, C3.2.5', ch: '' },
        { at: V(31, 4, 24), look: V(31.5, -6, 0), n: 'Helper T-cells activate a B-cell', s: 'Each pathogen carries antigens: molecules the body recognises as foreign. In a lymph node, a helper T-cell that recognises the antigen activates the B-cell that makes the matching antibody.', h: 'The B-cell needs two signals: binding the antigen itself, and contact with a helper T-cell that has recognised the same antigen. This double check stops antibodies being made against the body’s own cells.', cs: 'C3.2.6, C3.2.7, C3.2.8', ch: '' },
        { at: V(63, 2, 34), look: V(63, -8, 0), n: 'Clones of plasma cells', s: 'The activated B-cell divides many times, making a clone of identical cells. They become plasma cells, which secrete large amounts of one antibody.', h: 'Plasma cells are packed with rough ER for making antibody protein. Antibodies bind to antigens, clumping pathogens together and marking them for phagocytes.', cs: 'C3.2.9', ch: '' },
        { at: V(84, 6, 22), look: target, n: 'Antibodies at work', s: 'Each Y-shaped antibody binds to a specific antigen on the bacteria. Bound bacteria are easier for phagocytes to engulf and destroy.', h: 'The tips of the two arms are the variable regions that fit one antigen; one antibody can bind two pathogens at once, linking them into clumps.', cs: 'C3.2.6, C3.2.7', ch: '' },
        { at: V(101, 4, 24), look: V(101, -5, 0), n: 'Memory cells', s: 'Some of the clone become memory cells, which stay in the body for years. If the same pathogen returns, they respond so quickly that you usually do not become ill: you are immune.', h: 'Vaccines work the same way: they present the antigen without the disease, so memory cells form in advance.', cs: 'C3.2.10, C3.2.16', ch: '' }
