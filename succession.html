<style>

#defbox{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

<script>
window.JOURNEY = {
  title: 'Succession Time-lapse',
  sub: 'DP Biology D4.2 (HL) · simplified, not to scale',
  startTitle: 'From bare rock to forest',
  intro: 'Watch hundreds of years pass on one patch of land. Bare rock is colonised by lichens and mosses, soil builds up, then grasses, shrubs and finally trees take over. See what changes as succession goes on, and what can stop it.',
  note: 'Time is greatly speeded up. The cut-away edge at the front shows the soil getting deeper.',
  rideLabel: 'Watch the years pass',
  theme: { bg: '#0f1510', panel: 'rgba(16,26,16,.86)', accent: '#b5e48c', dim: '#c7d6c0', line: 'rgba(200,235,190,.22)' },
  fog: 0.006,
  build(A) {
    const { V, M, T, scene, THREE } = A;
    const NAMES = ['Bare rock', 'Pioneers: lichens and mosses', 'Grasses and small plants', 'Shrubs', 'Young forest', 'Climax forest'];
    const YEARS = ['Year 0', 'About 5 years', 'About 30 years', 'About 80 years', 'About 150 years', '300+ years'];
    let bar = null; function getBar() { if (bar) return bar; const b = document.getElementById('mx-bar'); if (!b) return null; NAMES.forEach(() => { const d = document.createElement('span'); d.style.cssText = 'flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2)'; b.appendChild(d); }); return bar = b; }
    const S = 40;
    const rock = new THREE.Mesh(new THREE.BoxGeometry(S, 6, S), M(0x6c757d, { roughness: 1 })); rock.position.y = -3; scene.add(rock);
    const boulders = []; for (let i = 0; i < 26; i++) { const b = new THREE.Mesh(new THREE.DodecahedronGeometry(A.rnd(0.8, 2.4)), M(0x8d99ae, { roughness: 1 })); b.position.set(A.rnd(-18, 18), 0.3, A.rnd(-18, 18)); scene.add(b); boulders.push(b); }
    const soil = new THREE.Mesh(new THREE.BoxGeometry(S, 1, S), M(0x5c4033, { roughness: 1 })); scene.add(soil);
    const humus = new THREE.Mesh(new THREE.BoxGeometry(S, 1, S), M(0x2d1e12, { roughness: 1 })); scene.add(humus);
    function patches(n, col, sz, h) { const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 7), M(col, { roughness: 1 }), n); const d = new THREE.Object3D(); const data = [];
      for (let i = 0; i < n; i++) data.push({ x: A.rnd(-19, 19), z: A.rnd(-19, 19), s: A.rnd(sz * 0.5, sz), h: A.rnd(h * 0.6, h), k: Math.random() }); scene.add(im); return { im, d, data }; }
    function plants(n, make) { const list = []; for (let i = 0; i < n; i++) { const g = make(); g.position.set(A.rnd(-18, 18), 0, A.rnd(-18, 18)); g.userData.k = Math.random(); g.rotation.y = A.rnd(0, 6); scene.add(g); list.push(g); } return list; }
    const lich = patches(220, 0xc9d36a, 1.1, 0.15), moss = patches(260, 0x52b788, 1.0, 0.3);
    const grassM = M(0x95d5b2), flowerM = [M(0xffd166), M(0xf4acb7), M(0xffffff)];
    const grass = plants(260, () => { const g = new THREE.Group(); for (let j = 0; j < 4; j++) { const b = new THREE.Mesh(new THREE.ConeGeometry(0.12, 1.6, 4), grassM); b.position.set(A.rnd(-0.3, 0.3), 0.8, A.rnd(-0.3, 0.3)); b.rotation.z = A.rnd(-0.3, 0.3); g.add(b); } if (Math.random() < 0.3) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 4), flowerM[Math.random() * 3 | 0]); f.position.y = 1.7; g.add(f); } return g; });
    const shrubM = M(0x588157, { roughness: 0.9 });
    const shrubs = plants(55, () => { const g = new THREE.Group(); for (let j = 0; j < 3; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(A.rnd(0.9, 1.4), 8, 6), shrubM); s.position.set(A.rnd(-0.7, 0.7), 1 + j * 0.3, A.rnd(-0.7, 0.7)); g.add(s); } return g; });
    const trunkM = M(0x6f4e37), birchM = M(0xe9ecef), pineM = M(0x2d6a4f), oakM = M(0x40916c);
    const pioneers = plants(18, () => { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 5, 6), birchM); t.position.y = 2.5; g.add(t); const c = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 6), M(0x80b918)); c.scale.y = 1.4; c.position.y = 5.6; g.add(c); return g; });
    const climax = plants(22, () => { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.7, 8, 8), trunkM); t.position.y = 4; g.add(t); for (let j = 0; j < 4; j++) { const c = new THREE.Mesh(new THREE.SphereGeometry(A.rnd(2.2, 3), 10, 8), Math.random() < 0.5 ? oakM : pineM); c.position.set(A.rnd(-1.4, 1.4), 8 + A.rnd(0, 2), A.rnd(-1.4, 1.4)); g.add(c); } return g; });
    const animals = Array.from({ length: 10 }, (_, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), M([0xe76f51, 0x264653, 0xf4a261][i % 3])); scene.add(m); return { m, k: Math.random() * 6, lvl: i < 3 ? 1.4 : i < 6 ? 2.2 : 9 }; });
    A.label('Soil depth (cut-away)', V(0, 1, S / 2 + 1.5));
    const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x), cl = x => Math.max(0, Math.min(1, x));
    let p = 0, target = 0, auto = true, hold = 0;
    function grow(list, amount) { list.forEach(g => { const v = sm(cl(amount * 1.4 - g.userData.k * 0.4)); g.visible = v > 0.02; g.scale.setScalar(Math.max(0.02, v)); }); }
    function pose(ph) {
      const soilD = 0.05 + sm(cl(ph / 5)) * 3.2; soil.scale.y = soilD; soil.position.y = soilD / 2 - 0.02; humus.scale.y = Math.max(0.02, soilD * 0.25 * cl(ph - 1.5)); humus.position.y = soilD + humus.scale.y / 2 - 0.02;
      boulders.forEach(b => b.position.y = 0.3 + soilD * 0.4); const top = soilD + humus.scale.y;
      const cover = (P, amt, fade) => { const { im, d, data } = P; let n = 0; data.forEach(o => { const v = sm(cl(amt * 1.5 - o.k * 0.5)) * (1 - fade); if (v < 0.03) return; d.position.set(o.x, top + o.h * v / 2, o.z); d.scale.set(o.s * v, Math.max(0.01, o.h * v), o.s * v); d.updateMatrix(); im.setMatrixAt(n++, d.matrix); }); im.count = n; im.instanceMatrix.needsUpdate = true; };
      cover(lich, cl(ph - 0.3), sm(cl(ph - 2))); cover(moss, cl(ph - 0.6), sm(cl(ph - 2.8)));
      grow(grass, cl(ph - 1.3) * (1 - 0.6 * sm(cl(ph - 4)))); grow(shrubs, cl(ph - 2.3) * (1 - 0.5 * sm(cl(ph - 4.6)))); grow(pioneers, cl(ph - 3.2) * (1 - 0.8 * sm(cl(ph - 4.5)))); grow(climax, cl((ph - 4) * 0.9));
      [grass, shrubs, pioneers, climax].forEach(l => l.forEach(g => g.position.y = top));
      animals.forEach((a, i) => { const need = i < 3 ? 1.5 : i < 6 ? 2.6 : 4; a.m.visible = ph > need; });
      const idx = Math.min(5, Math.round(ph)); const el = document.getElementById('mx-phase'); if (el && el.textContent !== NAMES[idx]) { el.textContent = NAMES[idx]; document.getElementById('mx-year').textContent = YEARS[idx]; }
      if (getBar()) [...bar.children].forEach((d, n) => d.style.background = n === idx ? '#b5e48c' : 'rgba(255,255,255,.2)');
    }
    pose(0); window.successionStage = v => { auto = false; target = p = v; };
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    const orbit = a => V(Math.sin(a) * 48, 20, Math.cos(a) * 48);
    return {
      route: [V(0, 40, 80), orbit(0.1), orbit(0.4), orbit(0.7), orbit(1.0), orbit(1.3), orbit(1.6), orbit(1.9)], hero, camOffset: V(0, 0, 0), outside: { target: V(0, 3, 0), dist: 75 },
      outsideInfo: { n: 'Succession on a loop', s: 'In this view the years run on a loop, from bare rock to forest. Drag to turn the patch and watch the soil deepen at the front edge.', h: 'Succession is a series of changes in a community over time. Each stage changes the conditions, making it easier for the next species to move in.', cs: 'D4.2.11', ch: '' },
      stops: [
        { at: orbit(0.1), look: V(0, 0, 0), n: 'Bare rock', s: 'After a lava flow, a retreating glacier or a landslide there is bare rock with no soil and no life. Primary succession starts here.', h: 'Conditions are harsh: no soil to hold water or minerals, and large swings in temperature.', cs: 'D4.2.11, D4.2.12', ch: '' },
        { at: orbit(0.4), look: V(0, 0, 0), n: 'Pioneer species', s: 'Lichens and mosses are the first to colonise. They can survive on bare rock, and they slowly break it down.', h: 'As pioneers die and decompose, organic matter mixes with rock fragments to make the first thin soil, which holds more water and minerals.', cs: 'D4.2.12', ch: '' },
        { at: orbit(0.7), look: V(0, 0, 0), n: 'Grasses and small plants', s: 'Once there is a little soil, grasses and small flowering plants can grow. Insects and other small animals arrive.', h: 'Their roots stabilise the soil and their remains add more humus, so the soil gets deeper and richer each year.', cs: 'D4.2.12', ch: '' },
        { at: orbit(1.0), look: V(0, 0, 0), n: 'Shrubs', s: 'Deeper soil supports shrubs, which shade out many of the grasses.', h: 'This is a key driver of succession: each community alters the abiotic conditions (light, soil, water) in ways that favour the species that will replace it.', cs: 'D4.2.11', ch: '' },
        { at: orbit(1.3), look: V(0, 0, 0), n: 'Young forest', s: 'Fast-growing trees such as birch move in, followed by larger, slower-growing trees.', h: 'Over the whole sequence, soil depth, biomass, the number of species and the complexity of food webs all increase.', cs: 'D4.2.12', ch: '' },
        { at: orbit(1.6), look: V(0, 0, 0), n: 'Climax community', s: 'Eventually a stable climax community forms, such as an oak forest. It changes little unless something disturbs it.', h: 'Grazing, fire or human management can arrest succession at an earlier stage, as on grazed grassland or heath. After a disturbance, secondary succession starts from soil, not bare rock, so it is faster.', cs: 'D4.2.14', ch: '' },
        { at: orbit(1.9), look: V(0, 0, 0), n: 'What has changed?', s: 'Compare the first and last stops: deeper soil, more biomass, more species and more complex food chains.', h: 'In some habitats succession is cyclical: for example, heather in a heath grows old, dies back and the cycle restarts, so the community keeps changing in a loop.', cs: 'D4.2.12', ch: 'D4.2.13' }
      ],
      side: '<div style="font-size:12px;opacity:.75" id="mx-year">Year 0</div><div id="mx-phase" style="font-size:18px;font-weight:700">Bare rock</div><div id="mx-bar" style="display:flex;gap:3px;margin-top:6px"></div>',
      onStop(i) { auto = false; target = [0, 1, 2, 3, 4, 5, 5][i]; },
      onView(v) { if (v === 'out') auto = true; },
      update(dt, A) { const run = A.paused ? 0 : dt, t = A.t;
        if (auto) { if (hold > 0) { hold -= run; if (hold <= 0) { hold = 0; p = 0; } } else { p += run * 0.2; if (p >= 5) { p = 5; hold = 2; } } }
        else { const d = target - p; p += Math.sign(d) * Math.min(Math.abs(d), run * (Math.abs(d) > 2 ? 2.5 : 0.7)); }
        pose(p);
        animals.forEach((a, i) => { const r = 6 + (i % 4) * 3; a.m.position.set(Math.cos(t * 0.3 + a.k) * r, a.lvl + soil.scale.y + Math.sin(t * 2 + a.k) * 0.3, Math.sin(t * 0.3 + a.k) * r); });
      }
    };
  }
};

</script>
<script>
/* What the Cell walk-through engine (2026-11-16). A page supplies window.JOURNEY = {title, sub, intro, note, theme,
   rideLabel, build(api)}; build returns {route:[Vector3...], stops:[{at,n,s,h,cs,ch}], outside:{target,dist},
   hero (mesh, optional), camOffset (Vector3), update(dt, api), side (html, optional), fog}.
   Stops: s = SL text, h = extra HL text, cs = SL codes, ch = extra HL codes.
   Close-ups (2026-11-17): a stop may carry dive (or dives: [..]) = {n, bg, target, dist, yaw, pitch, side,
   steps:[{n,s,h,cs,ch,at,dist}], build(api) -> {update(dt,api,step), onStep(i,step)}}. W.dives lists close-ups for the outside view.
   A close-up is built once, in its own scene, the first time it is opened; its labels show only while it is open.
   The page may open one itself with api.openDive(d); location.hash #zoom-<n> opens W.dives[n] at load. */
(function(){

$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
