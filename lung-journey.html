<script>
window.JOURNEY = {
  title: 'Journey Into the Lungs',
  sub: 'DP Biology B3.1 · simplified, not to scale',
  startTitle: 'Take a breath and go in',
  intro: 'Ride a breath of air down the trachea, through the bronchi and bronchioles, into an alveolus. Watch oxygen cross into the blood and carbon dioxide come out. The outside view shows the diaphragm and ribs moving as the lungs are ventilated.',
  note: 'The alveoli are drawn hugely enlarged: each is only about 0.2 mm across, and there are about 300 million in your lungs. White dots are oxygen; grey dots are carbon dioxide.',
  rideLabel: 'Ride with the air',
  theme: { bg: '#0d1626', panel: 'rgba(12,24,40,.86)', accent: '#7ee0ff', dim: '#b8c9dd', line: 'rgba(180,220,255,.22)' },
  fog: 0.005,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    // ===================== close-ups (2026-11-17) =====================
    const cl = (x, a, b) => Math.max(a, Math.min(b, x)), ramp = (p, a, b) => cl((p - a) / (b - a), 0, 1), ease = k => k * k * (3 - 2 * k);
    function rbcGeo(R, seg) { const pts = []; const n = 20; const z = r => 0.5 * R * Math.sqrt(Math.max(0, 1 - (r / R) ** 2)) * (0.207 + 2.003 * (r / R) ** 2 - 1.123 * (r / R) ** 4);
      for (let i = 0; i <= n; i++) { const r = R * Math.sin(i / n * Math.PI / 2); pts.push(new THREE.Vector2(Math.max(0.001, r), z(r) * 1.5 + 0.02 * R)); }
      for (let i = n; i >= 0; i--) { const r = R * Math.sin(i / n * Math.PI / 2); pts.push(new THREE.Vector2(Math.max(0.001, r), -z(r) * 1.5 - 0.02 * R)); } return new THREE.LatheGeometry(pts, seg || 24); }
    const rbcM = c => M(c, { roughness: 0.38, emissive: c, emissiveIntensity: 0.12 });

    // ---------- 1. Gas exchange in an alveolus ----------
    const D_ALV = { n: 'Gas exchange in an alveolus', bg: '#0d1626', dist: 70, target: V(0, 0, 0), yaw: 0.6, pitch: 0.3,
      steps: [
        { n: 'An alveolus cut open', s: 'This is one alveolus, cut in half and enlarged about 400 times. Air fills the inside. A network of capillaries (red and purple) wraps round the outside.', cs: 'B3.1.4' },
        { n: 'A very thin wall', s: 'Most of the wall is made of type I pneumocytes: flattened cells only about 0.2 µm thick. The capillary wall is also one cell thick, so gases only have to diffuse about 0.5 µm.', cs: 'B3.1.2, B3.1.4', at: V(0, 0, 10), dist: 40 },
        { n: 'A moist lining and surfactant', s: 'The inside is lined with a thin film of moisture (blue), so oxygen can dissolve before it diffuses. Rounder type II pneumocytes (gold) secrete surfactant, which lowers surface tension so the alveoli do not collapse and stick together when you breathe out.', cs: 'B3.1.4', at: V(-6, -4, 6), dist: 38 },
        { n: 'Oxygen diffuses in', s: 'Air in the alveolus has a higher concentration of oxygen (white) than blood arriving from the body. Oxygen diffuses across the wall into the blood, where red blood cells pick it up.', cs: 'B3.1.2, B3.1.3', at: V(0, 0, 8), dist: 46 },
        { n: 'Carbon dioxide diffuses out', s: 'Blood arriving from the body has more carbon dioxide (grey) than the air in the alveolus, so carbon dioxide diffuses out into the alveolus and is breathed out.', cs: 'B3.1.2, B3.1.3', at: V(0, 0, 8), dist: 46 },
        { n: 'Keeping the gradients steep', s: 'Ventilation keeps bringing fresh air with lots of oxygen and removing carbon dioxide. Blood flow keeps carrying oxygenated blood away and bringing new deoxygenated blood. So the concentration gradients never disappear.', cs: 'B3.1.3' },
        { n: 'A huge surface', s: 'About 300 million alveoli give the lungs a total surface area of about 70 m2, and a dense capillary network covers it. Large area, thin, moist, permeable and with steep gradients: all the features of a good gas-exchange surface.', cs: 'B3.1.2, B3.1.4' }
      ],
      build(D) { const g = D.scene; let step = 0, tt = 0;
        // alveolar wall: hemisphere-ish shell, cut open
        const shell = new THREE.Mesh(new THREE.SphereGeometry(20, 64, 48, 0, Math.PI * 2, 0, Math.PI * 0.62), M(0xf4b6c2, { side: THREE.DoubleSide, roughness: 0.6, transparent: true, opacity: 0.55 })); shell.rotation.x = -Math.PI / 2; g.add(shell);
        const film = new THREE.Mesh(new THREE.SphereGeometry(19.5, 64, 48, 0, Math.PI * 2, 0, Math.PI * 0.62), new THREE.MeshPhysicalMaterial({ color: 0x8fd3ff, transparent: true, opacity: 0.28, roughness: 0.1, side: THREE.BackSide, depthWrite: false })); film.rotation.x = -Math.PI / 2; g.add(film);
        const onS = (a, b, r) => V(Math.sin(a) * Math.cos(b), Math.sin(a) * Math.sin(b), -Math.cos(a)).multiplyScalar(r).applyAxisAngle(V(1, 0, 0), 0); // a: from back pole
        // type I nuclei bulges and type II cells
        for (let i = 0; i < 18; i++) { const p = A.onSphere(1); if (p.z > 0.55) continue; const m = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), M(0x8a5fb0)); m.position.copy(p.multiplyScalar(20.3)); m.lookAt(0, 0, 0); m.scale.set(1.6, 1.0, 0.45); g.add(m); }
        const t2 = []; for (let i = 0; i < 5; i++) { let p; do { p = A.onSphere(1); } while (p.z > 0.4); const c = new THREE.Group(); c.position.copy(p.clone().multiplyScalar(19.2)); c.lookAt(0, 0, 0); g.add(c);
          const body = new THREE.Mesh(new THREE.SphereGeometry(2.2, 18, 12), M(0xf2b84b, { roughness: 0.5 })); body.scale.set(1, 1, 0.8); c.add(body);
          for (let k = 0; k < 6; k++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), M(0xfff1b8, { emissive: 0x443300 })); d.position.set(A.rnd(-1.2, 1.2), A.rnd(-1.2, 1.2), 1.6); c.add(d); } t2.push(c); }
        // capillaries wrapped round the outside
        const caps = []; for (let i = 0; i < 7; i++) { const b = -1.2 + i * 0.4, pts = []; for (let k = 0; k <= 12; k++) { const a = -1.4 + k * 0.233; const r = 22.4; pts.push(V(Math.sin(a) * r * Math.cos(b * 0.5), r * Math.sin(b * 0.6) + Math.sin(k + i) * 0.8, -Math.cos(a) * r * Math.cos(b * 0.5))); }
          const c = new THREE.CatmullRomCurve3(pts); caps.push(c); const geo = new THREE.TubeGeometry(c, 60, 1.5, 12, false); const col = geo.attributes.position; const cols = new Float32Array(col.count * 3); const cA = new THREE.Color(0x6b2f8f), cB = new THREE.Color(0xc8102e), tmp = new THREE.Color();
          for (let j = 0; j < col.count; j++) { const u = Math.floor(j / 13) / 60; tmp.lerpColors(cA, cB, cl((u - 0.3) / 0.4, 0, 1)); cols[j * 3] = tmp.r; cols[j * 3 + 1] = tmp.g; cols[j * 3 + 2] = tmp.b; } geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
          g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.5, roughness: 0.4, depthWrite: false }))); }
        const rg = rbcGeo(1.1, 16); const cells = []; for (let i = 0; i < 42; i++) { const m = new THREE.Mesh(rg, rbcM(0x6b1f52)); g.add(m); cells.push({ m, c: caps[i % caps.length], u: Math.random(), r: A.rnd(0, 6) }); }
        const oG = new THREE.SphereGeometry(0.35, 8, 6), o2 = [], co2 = []; const pair = (mat) => { const o = new THREE.Group(); const a = new THREE.Mesh(oG, mat), b = new THREE.Mesh(oG, mat); a.position.x = -0.28; b.position.x = 0.28; o.add(a, b); g.add(o); return o; };
        const oM = M(0xffffff, { emissive: 0x555555 }), cM = M(0x8a8f99);
        for (let i = 0; i < 50; i++) { const o = pair(oM); const c = caps[i % caps.length]; const u = A.rnd(0.25, 0.75); o2.push({ o, from: A.onSphere(A.rnd(4, 15)).setZ(A.rnd(-14, 4)), to: c.getPointAt(u), q: Math.random() }); }
        for (let i = 0; i < 30; i++) { const o = pair(cM); o.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 6), M(0x333333))); const c = caps[(i + 2) % caps.length]; co2.push({ o, from: c.getPointAt(A.rnd(0.2, 0.5)), to: A.onSphere(A.rnd(4, 14)).setZ(A.rnd(-14, 4)), q: Math.random() }); }
        const lb = [D.label('Air inside the alveolus', V(0, 4, -6)), D.label('Type I pneumocyte (thin wall)', V(-15, 12, -8)), D.label('Type II pneumocyte (surfactant)', t2[0].position.clone().multiplyScalar(0.85)), D.label('Moist lining', V(10, -10, -10)), D.label('Capillary', V(18, 8, -16)), D.label('Deoxygenated blood in', V(-24, -6, 0)), D.label('Oxygenated blood out', V(24, -6, 0))];
        return { onStep(i) { step = i; },
          update(dt) { if (!A.paused) tt += dt; const run = A.paused ? 0 : dt;
            cells.forEach(c => { c.u = (c.u + run * 0.06) % 1; c.m.position.copy(c.c.getPointAt(c.u)); const k = cl((c.u - 0.3) / 0.4, 0, 1); c.m.material.color.lerpColors(new THREE.Color(0x6b1f52), new THREE.Color(0xc8102e), k); c.m.material.emissive.copy(c.m.material.color); c.m.rotation.set(c.r + c.u * 20, c.u * 12, 0); });
            const showO = step >= 3 && step !== 4 || step === 0, showC = step >= 4 && step !== 3 || step === 0;
            o2.forEach(p => { p.o.visible = showO; p.q = (p.q + run * 0.22) % 1; p.o.position.copy(p.from).lerp(p.to, ease(p.q)); p.o.rotation.y += run * 2; });
            co2.forEach(p => { p.o.visible = showC; p.q = (p.q + run * 0.2) % 1; p.o.position.copy(p.from).lerp(p.to, ease(p.q)); p.o.rotation.y += run * 2; });
            film.material.opacity = step === 2 ? 0.45 + 0.1 * Math.sin(tt * 3) : 0.22; t2.forEach(c => { c.scale.setScalar(step === 2 ? 1.15 + 0.08 * Math.sin(tt * 4) : 1); });
            lb[3].dataset.off = step === 2 || step === 0 ? '0' : '1'; lb[2].dataset.off = step === 2 || step === 0 ? '0' : '1'; } };
      } };

    // ---------- 2. Breathing in and out ----------
    const D_VENT = { n: 'Breathing in and out', bg: '#0d1626', dist: 105, target: V(0, 0, 0), yaw: 0.0, pitch: 0.08, still: true,
      side: '<h3 id="vt-h">Breathing in</h3><div class="row">Thorax volume: <b id="vt-v" style="margin-left:auto">-</b></div><div class="row">Pressure in lungs: <b id="vt-p" style="margin-left:auto">-</b></div><div class="row" style="color:var(--dim)">compared with the air outside</div>',
      steps: [
        { n: 'The thorax', s: 'The lungs sit in the thorax, an airtight space enclosed by the ribs and the intercostal muscles between them, with the dome-shaped diaphragm underneath. Muscles can only pull, so breathing uses pairs of antagonistic muscles.', cs: 'B3.1.5' },
        { n: 'Breathing in (inspiration)', s: 'The diaphragm contracts and flattens, moving down. The external intercostal muscles contract and pull the ribs up and out. Both make the thorax bigger.', cs: 'B3.1.5' },
        { n: 'Volume up, pressure down', s: 'As the volume of the thorax and lungs increases, the pressure inside falls below the pressure of the air outside. Air flows in down the pressure gradient until the pressures are equal.', cs: 'B3.1.5' },
        { n: 'Breathing out (expiration)', s: 'At rest, breathing out is mostly passive: the diaphragm and external intercostals relax, the diaphragm domes up and the ribs fall, and elastic recoil of the lungs helps. Volume falls, pressure rises above the air outside, and air flows out.', cs: 'B3.1.5' },
        { n: 'Forced breathing out', s: 'When you breathe out hard, the internal intercostal muscles contract and pull the ribs down and in, and the abdominal muscles push the diaphragm up. These are antagonistic to the muscles used for breathing in.', cs: 'B3.1.5' },
        { n: 'Watch a few breaths', s: 'Follow the numbers on the right as the thorax changes size: whenever lung pressure is below the outside pressure, air flows in.', cs: 'B3.1.5' }
      ],
      build(D) { const g = D.scene; let step = 0, tt = 0, ph = 0;
        const bone = M(0xf2ead8, { roughness: 0.5 }); const ribs = [];
