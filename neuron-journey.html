<script>
window.JOURNEY = {
  title: 'Journey Along a Neuron',
  sub: 'DP Biology C2.2 · simplified, not to scale',
  startTitle: 'Follow a nerve impulse',
  intro: 'Travel from the dendrites of a motor neuron, past the cell body and along a myelinated axon to a synapse. Watch the impulse jump between nodes of Ranvier, and see a neurotransmitter carry the signal across the synaptic cleft.',
  note: 'Orange dots are sodium ions, purple dots potassium ions, green dots calcium ions and blue dots neurotransmitter. The impulse is slowed down by about a million times.',
  rideLabel: 'Ride with the impulse',
  theme: { bg: '#0c1220', panel: 'rgba(12,20,36,.86)', accent: '#ffd166', dim: '#b9c4dc', line: 'rgba(180,200,255,.22)' },
  fog: 0.005,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const nerve = M(0xe9c9ff, { roughness: 0.5 });
    // Cell body with nucleus and dendrites
    const soma = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 24), T(0xd9b8f5, 0.55)); soma.position.set(-70, 0, 0); scene.add(soma);
    const nuc = new THREE.Mesh(new THREE.SphereGeometry(2.8, 24, 18), M(0x6a3fa0)); nuc.position.set(-71, 1, 0); scene.add(nuc);
    function dend(start, dir, len, r, depth) { const end = start.clone().addScaledVector(dir, len); scene.add(tube([start, start.clone().lerp(end, 0.5).add(A.onSphere(1)), end], r, nerve, 12)); if (depth > 0) [-0.5, 0.5].forEach(a => dend(end, dir.clone().applyAxisAngle(V(0, 0, 1), a).applyAxisAngle(V(1, 0, 0), A.rnd(-0.6, 0.6)).normalize(), len * 0.7, r * 0.65, depth - 1)); }
    [[-1, 0.6, 0], [-1, -0.5, 0.3], [-0.6, 0.9, -0.4], [-0.5, -1, -0.3], [-1, 0.1, -0.8]].forEach(d => dend(V(-74, 0, 0), V(...d).normalize(), 10, 1.1, 2));
    // Axon from x=-63 to x=60 with myelin sheaths (Schwann cells) and nodes of Ranvier
    scene.add(tube([V(-63, 0, 0), V(60, 0, 0)], 0.9, nerve, 60));
    const nodes = []; for (let x = -54; x < 56; x += 12) nodes.push(x);
    const myelin = T(0xfff3c4, 0.5);
    for (let i = 0; i < nodes.length - 1; i++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 10, 24), myelin); m.rotation.z = Math.PI / 2; m.position.set(nodes[i] + 6, 0, 0); scene.add(m); }
    const glows = nodes.map(x => { const g = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.35, 8, 24), M(0xffd166, { emissive: 0x000000 })); g.rotation.y = Math.PI / 2; g.position.set(x, 0, 0); scene.add(g); return g; });
    // Axon terminal, synaptic knob, cleft and the next cell
    scene.add(tube([V(60, 0, 0), V(66, 2, 0), V(70, 2, 0)], 0.9, nerve, 12));
    const knob = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.75), T(0xd9b8f5, 0.45)); knob.rotation.z = -Math.PI / 2; knob.position.set(74, 2, 0); scene.add(knob);
    const post = new THREE.Mesh(new THREE.BoxGeometry(2, 22, 22), T(0x9ad7ff, 0.35)); post.position.set(81, 2, 0); scene.add(post);
    const rec = M(0x3fd0c0); for (let i = 0; i < 9; i++) { const r = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.6, 10), rec); r.rotation.z = Math.PI / 2; r.position.set(80, 2 + A.rnd(-4, 4), A.rnd(-4, 4)); scene.add(r); }
    const ves = []; for (let i = 0; i < 16; i++) { const v = new THREE.Mesh(new THREE.SphereGeometry(0.85, 14, 10), T(0xffffff, 0.5)); const home = V(74 + A.rnd(-2, 1.5), 2 + A.rnd(-3, 3), A.rnd(-3, 3)); v.position.copy(home); scene.add(v); ves.push({ v, home }); }
    const mito = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 8), M(0xff8c42)); mito.position.set(72, -1, 1.5); mito.scale.set(1.6, 0.8, 0.8); scene.add(mito);
    A.label('Dendrites', V(-84, 8, 0)); A.label('Cell body', V(-70, 9, 0)); A.label('Nucleus', V(-71, 4, 4)); A.label('Axon', V(-40, 4, 0)); A.label('Myelin sheath', V(-12, 4, 0)); A.label('Node of Ranvier', V(6, -4, 0)); A.label('Synaptic knob', V(74, 9, 0)); A.label('Synaptic cleft', V(78, -9, 0)); A.label('Postsynaptic membrane', V(83, 14, 0)); A.label('Vesicles', V(71, 6, 4));
    // Ions and neurotransmitter
    const sphere = r => new THREE.SphereGeometry(r, 8, 6); const naM = M(0xff8c42, { emissive: 0x552200 }), kM = M(0x9b5de5, { emissive: 0x2a0a4a }), caM = M(0x6bd66b), ntM = M(0x4fb3ff, { emissive: 0x0a2a55 });
    const ions = []; for (let i = 0; i < 80; i++) { const na = i % 2 === 0; const m = new THREE.Mesh(sphere(0.35), na ? naM : kM); scene.add(m); ions.push({ m, na, node: i % nodes.length, ph: Math.random() }); }
    const ca = []; for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(sphere(0.32), caM); scene.add(m); ca.push({ m, a: A.onSphere(1) }); }
    const nt = []; for (let i = 0; i < 30; i++) { const m = new THREE.Mesh(sphere(0.28), ntM); scene.add(m); nt.push({ m, y: 2 + A.rnd(-3, 3), z: A.rnd(-3, 3) }); }
    // Membrane potential trace
    const PERIOD = 4.5; const apPos = t => { const f = (t % PERIOD) / PERIOD; return { f, x: -60 + f * 1.6 * 130 }; };
    function vm(dtSince) { if (dtSince < 0 || dtSince > 0.9) return -70; const s = dtSince / 0.9; if (s < 0.25) return -70 + 100 * (s / 0.25); if (s < 0.55) return 30 - 110 * ((s - 0.25) / 0.3); return -80 + 10 * ((s - 0.55) / 0.45); }
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), M(0xffd166, { emissive: 0x664400 })); scene.add(hero);
    // ===================== close-ups (2026-11-17) =====================
    const cl = (x, a, b) => Math.max(a, Math.min(b, x)), ramp = (p, a, b) => cl((p - a) / (b - a), 0, 1), ease = k => k * k * (3 - 2 * k);
    // A patch of phospholipid bilayer: heads as instanced spheres, tails as short lines. Lies in the x-z plane at y=0.
    function bilayer(g, W, Dp, gapAt) { const heads = []; for (let x = -W / 2; x <= W / 2; x += 1.25) for (let z = -Dp / 2; z <= Dp / 2; z += 1.25) { if (gapAt && gapAt.some(p => Math.hypot(x - p.x, z - p.z) < p.r)) continue; heads.push([x, z]); }
      const hg = new THREE.SphereGeometry(0.5, 8, 6), hm = new THREE.MeshStandardMaterial({ color: 0xf2c879, roughness: 0.5 }); const inst = new THREE.InstancedMesh(hg, hm, heads.length * 2); const mt = new THREE.Matrix4(); let k = 0;
      heads.forEach(([x, z]) => { mt.makeTranslation(x, 2, z); inst.setMatrixAt(k++, mt); mt.makeTranslation(x, -2, z); inst.setMatrixAt(k++, mt); }); g.add(inst);
      const tp = []; heads.forEach(([x, z]) => { tp.push(x - 0.15, 1.6, z, x - 0.15, 0.15, z, x + 0.15, 1.6, z, x + 0.15, 0.15, z, x - 0.15, -1.6, z, x - 0.15, -0.15, z, x + 0.15, -1.6, z, x + 0.15, -0.15, z); });
      const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3)); g.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0xd9b26a, transparent: true, opacity: 0.6 }))); }
    // A channel: ring of subunits around a pore through the bilayer. open() widens it.
    function channel(g, x, z, col, n) { const grp = new THREE.Group(); grp.position.set(x, 0, z); g.add(grp); const subs = [];
      for (let i = 0; i < (n || 4); i++) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 5.4, 14), M(col, { roughness: 0.45 })); grp.add(s); subs.push({ s, a: i * Math.PI * 2 / (n || 4) }); }
      const o = { grp, k: 0, set(k) { o.k = k; subs.forEach(u => { const r = 0.95 + 0.75 * k; u.s.position.set(Math.cos(u.a) * r, 0, Math.sin(u.a) * r); }); } }; o.set(0); return o; }
    const ionMat = { na: M(0xff8c42, { emissive: 0x552200 }), k: M(0x9b5de5, { emissive: 0x2a0a4a }), ca: M(0x6bd66b, { emissive: 0x0a3a0a }), cl: M(0xbdf26b, { emissive: 0x2a3a00 }), nt: M(0x4fb3ff, { emissive: 0x0a2a55 }) };
    const ion = (g, kind, r) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r || 0.45, 10, 8), ionMat[kind]); g.add(m); return m; };

    // ---------- 1. Synaptic transmission ----------
    const D_SYN = { n: 'Synaptic transmission', bg: '#0b1222', dist: 62, target: V(0, 0, 0), yaw: 0.12, pitch: 0.15,
      steps: [
        { n: 'A synapse', s: 'A synapse is a junction between two neurons (or a neuron and a muscle). The end of the first neuron (presynaptic knob, left) is separated from the next cell (right) by a gap of about 20 nm, the synaptic cleft. Electrical impulses cannot jump the gap, so a chemical carries the signal across.', cs: 'C2.2.5' },
        { n: '1. An impulse arrives', s: 'An action potential travels down the axon and depolarizes the membrane of the presynaptic knob.', cs: 'C2.2.6' },
        { n: '2. Calcium ions enter', s: 'The depolarization opens voltage-gated calcium channels. Calcium ions (green) diffuse into the knob, because there are far more of them outside.', cs: 'C2.2.6', at: V(-6, 0, 0), dist: 40 },
        { n: '3. Vesicles release neurotransmitter', s: 'Calcium makes vesicles full of neurotransmitter move to the presynaptic membrane and fuse with it. The neurotransmitter (blue) is released into the cleft by exocytosis.', cs: 'C2.2.6', at: V(-4, 0, 0), dist: 36 },
        { n: '4. Diffusion across the cleft', s: 'The neurotransmitter molecules diffuse across the narrow cleft to the postsynaptic membrane in a fraction of a millisecond.', cs: 'C2.2.6', at: V(0, 0, 0), dist: 34 },
        { n: '5. Binding to receptors', s: 'The neurotransmitter binds to receptor proteins on the postsynaptic membrane. Each receptor is also an ion channel: binding makes it open.', cs: 'C2.2.7', at: V(3, 0, 0), dist: 34 },
        { n: '6. The next cell depolarizes', s: 'Sodium ions (orange) flow in through the open receptors and depolarize the postsynaptic membrane: an excitatory postsynaptic potential. If enough sodium enters to reach threshold, a new action potential starts in the next neuron.', h: 'One synapse is rarely enough: many small potentials must add up (summation) to reach threshold.', cs: 'C2.2.7', ch: 'C2.2.14', at: V(6, 0, 0), dist: 40 },
        { n: '7. The signal is switched off', s: 'Acetylcholinesterase (green enzymes in the cleft) breaks acetylcholine down. The choline part is taken back into the presynaptic knob, so the receptors close and the signal stops quickly.', h: 'Other neurotransmitters, such as dopamine, are removed whole by reuptake pumps instead.', cs: 'C2.2.7', at: V(0, 0, 0), dist: 38 },
        { n: '8. Recycling', s: 'In the knob, choline is joined to acetyl groups again and loaded into new vesicles. This uses ATP from the many mitochondria (orange) in the knob.', cs: 'C2.2.6', at: V(-8, 0, 0), dist: 40 },
        { n: 'Chemicals that change transmission', s: 'Some chemicals from outside the body act at synapses. Neonicotinoid insecticides (yellow) bind to acetylcholine receptors and are not broken down by acetylcholinesterase, so the receptors stay open; in insects this causes paralysis and death.', h: 'Cocaine blocks dopamine reuptake pumps, so dopamine stays in the cleft and keeps stimulating the next neuron.', ch: 'C2.2.12', cs: 'C2.2.12', at: V(3, 0, 0), dist: 36 },
        { n: 'Inhibitory synapses', s: 'At an inhibitory synapse the neurotransmitter (such as GABA) opens chloride channels. Negative chloride ions (lime) flow in and make the inside even more negative (hyperpolarized), so the next neuron is less likely to fire.', ch: 'C2.2.13', cs: 'C2.2.13', at: V(5, 0, 0), dist: 40 },
        { n: 'Watch it all', s: 'The whole sequence plays on a loop: impulse, calcium in, exocytosis, diffusion, binding, sodium in, breakdown and recycling. In a real synapse this takes about one millisecond.', cs: 'C2.2.5, C2.2.6, C2.2.7' }
      ],
      build(D) { const g = D.scene; let step = 0, lt = 0, tt = 0;
        const pre = new THREE.Mesh(new THREE.SphereGeometry(16, 48, 36), T(0xd9b8f5, 0.3)); pre.position.x = -19; g.add(pre);
        const preM = new THREE.Mesh(new THREE.SphereGeometry(16.05, 48, 36), new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })); preM.position.x = -19; g.add(preM);
        g.add(tube([V(-60, 0, 0), V(-34, 0, 0)], 3, T(0xd9b8f5, 0.3), 10));
        const postC = V(41, 0, 0), postR = 38; const post = new THREE.Mesh(new THREE.SphereGeometry(postR, 64, 48), T(0x9ad7ff, 0.25)); post.position.copy(postC); g.add(post);
        const postM = new THREE.Mesh(new THREE.SphereGeometry(postR + 0.05, 64, 48), new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })); postM.position.copy(postC); g.add(postM);
        const onPre = (a, b, d) => { const dir = V(Math.cos(b) * Math.cos(a), Math.sin(a), Math.sin(b) * Math.cos(a)); return V(-19, 0, 0).add(dir.multiplyScalar(16 + (d || 0))); };
        const onPost = (a, b, d) => { const dir = V(-Math.cos(b) * Math.cos(a), Math.sin(a), Math.sin(b) * Math.cos(a)); return postC.clone().add(dir.multiplyScalar(postR + (d || 0))); };
        // calcium channels (presynaptic), receptors (postsynaptic)
        const caCh = [[0.42, 0.1], [-0.42, -0.1], [0.05, 0.45], [0.0, -0.45]].map(([a, b]) => { const c = new THREE.Group(); const p = onPre(a, b); c.position.copy(p); c.lookAt(V(-19, 0, 0)); g.add(c);
          const subs = [0, 1, 2, 3].map(i => { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2.4, 10), M(0x6bd66b)); s.rotation.x = Math.PI / 2; c.add(s); return { s, a: i * Math.PI / 2 }; }); return { c, subs, p }; });
        const recs = []; for (let i = 0; i < 10; i++) { const a = (i % 5 - 2) * 0.09, b = (Math.floor(i / 5) - 0.5) * 0.18 + (i % 2) * 0.04; const p = onPost(a, b); const c = new THREE.Group(); c.position.copy(p); c.lookAt(postC); g.add(c);
