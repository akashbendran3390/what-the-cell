<script>
window.JOURNEY = {
  title: 'Enzyme Lab',
  sub: 'DP Biology C1.1 · a simulation, not to scale',
  startTitle: 'Run your own enzyme experiment',
  intro: 'Watch substrate molecules (blue) collide with an enzyme and fit into its active site, then leave as products (orange). Use the sliders to change temperature, pH and substrate concentration and watch the reaction rate graph. At HL, add an inhibitor.',
  note: 'This is a model: one enzyme molecule is shown, with an optimum near 37 °C and pH 7, like many human enzymes. Too much heat or the wrong pH changes its shape (denaturation).',
  rideLabel: 'Guided tour',
  theme: { bg: '#0e1420', panel: 'rgba(14,22,34,.88)', accent: '#7bdff2', dim: '#c2cede', line: 'rgba(190,220,250,.22)' },
  fog: 0.003,
  build(A) {
    const { V, M, T, scene, THREE } = A;
    const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(70, 50, 50)), new THREE.LineBasicMaterial({ color: 0x33445a })); scene.add(box);
    // Enzyme: a globular protein with a pocket (active site) on top
    const enz = new THREE.Group(); scene.add(enz);
    const bodyGeo = new THREE.SphereGeometry(8, 48, 32); const base = bodyGeo.attributes.position.array.slice();
    const body = new THREE.Mesh(bodyGeo, M(0x5e60ce, { roughness: 0.45, flatShading: false })); enz.add(body);
    const site = new THREE.Mesh(new THREE.ConeGeometry(2.6, 4, 24, 1, true), M(0x2b2d6e, { side: THREE.DoubleSide })); site.rotation.x = Math.PI; site.position.y = 6.6; enz.add(site);
    const allo = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12), M(0x3a3c8f)); allo.position.set(7.4, -2, 0); enz.add(allo);
    const subGeo = new THREE.ConeGeometry(1.6, 3.4, 16), subM = M(0x4fb3ff), prodM = M(0xff9f1c), inhM = M(0xff4d6d);
    const S = []; function addS(kind) { const m = new THREE.Mesh(kind === 'prod' ? new THREE.SphereGeometry(0.9, 12, 8) : subGeo, kind === 'prod' ? prodM : kind === 'inh' ? inhM : subM); scene.add(m);
      const o = { m, kind, p: V(A.rnd(-32, 32), A.rnd(-22, 22), A.rnd(-22, 22)), v: A.onSphere(1), bound: 0, life: 0 }; if (o.p.length() < 12) o.p.setLength(14); S.push(o); return o; }
    let temp = 37, pH = 7, conc = 20, inhib = 'none', denat = 0, bound = null, rateHist = [], made = 0, tAcc = 0;
    for (let i = 0; i < conc; i++) addS('sub');
    function setConc(n) { const subs = S.filter(s => s.kind === 'sub'); while (subs.length < n) subs.push(addS('sub')); while (subs.length > n) { const s = subs.pop(); scene.remove(s.m); S.splice(S.indexOf(s), 1); } }
    function setInhib(k) { inhib = k; S.filter(s => s.kind === 'inh').forEach(s => { scene.remove(s.m); S.splice(S.indexOf(s), 1); }); if (k !== 'none') for (let i = 0; i < 6; i++) addS('inh'); }
    A.label('Enzyme', V(-9, -9, 0)); A.label('Active site', V(0, 11, 0)); A.label('Allosteric site', V(10, -3, 0));
    let wired = false, gctx = null;
    function wire() { const q = id => document.getElementById(id); if (!q('e-temp')) return; wired = true;
      q('e-temp').oninput = e => { temp = +e.target.value; q('e-tv').textContent = temp + ' °C'; };
      q('e-ph').oninput = e => { pH = +e.target.value; q('e-pv').textContent = 'pH ' + pH; };
      q('e-conc').oninput = e => { conc = +e.target.value; q('e-cv').textContent = conc + ' molecules'; setConc(conc); };
      q('e-reset').onclick = () => { denat = 0; temp = 37; pH = 7; q('e-temp').value = 37; q('e-ph').value = 7; q('e-tv').textContent = '37 °C'; q('e-pv').textContent = 'pH 7'; };
      if (q('e-inh')) q('e-inh').onchange = e => setInhib(e.target.value);
      gctx = q('e-graph').getContext('2d'); }
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    setTimeout(wire, 0);
    return {
      route: [V(0, 14, 44), V(-20, 10, 30), V(-24, 6, 20), V(0, 16, 22), V(20, 6, 26), V(26, 2, 20), V(14, -4, 26)], hero, camOffset: V(0, 0, 0), outside: { target: V(0, 0, 0), dist: 70 },
      outsideInfo: { n: 'Free experiment', s: 'Drag to turn the view. Change one variable at a time with the sliders and watch the rate graph.', h: '', cs: 'C1.1.8, C1.1.9', ch: '' },
      stops: [
        { at: V(-20, 10, 30), look: V(0, 4, 0), n: 'Enzyme and active site', s: 'An enzyme is a globular protein. Its active site is a pocket with a particular shape and chemical properties that only fits one kind of substrate.', h: 'The shape of the active site comes from the enzyme’s tertiary structure, held by bonds between R-groups.', cs: 'C1.1.1, C1.1.4', ch: 'B1.2.9' },
        { at: V(-24, 6, 20), look: V(0, 6, 0), n: 'Collisions and induced fit', s: 'Substrate molecules move randomly and only react when they collide with the active site the right way round. When one binds, the active site changes shape slightly to grip it (induced fit).', h: 'Binding strains bonds in the substrate, lowering the activation energy so the reaction happens faster.', cs: 'C1.1.5, C1.1.6', ch: 'C1.1.10' },
        { at: V(0, 16, 22), look: V(0, 4, 0), n: 'Temperature', s: 'Move the temperature slider. Warmer molecules move faster and collide more often, so the rate rises. Above about 45 °C the enzyme starts to denature and the rate falls.', h: 'Heat breaks hydrogen and ionic bonds in the enzyme, changing the shape of the active site. Denaturation is usually permanent: press Reset to replace the enzyme.', cs: 'C1.1.7, C1.1.8', ch: '' },
        { at: V(20, 6, 26), look: V(0, 4, 0), n: 'pH', s: 'Move the pH slider. Each enzyme has an optimum pH. Away from it, the charges on the active site change and fewer substrates fit; extreme pH denatures the enzyme.', h: 'Pepsin in the stomach works best near pH 2; many enzymes in the cytoplasm work best near pH 7.', cs: 'C1.1.8', ch: '' },
        { at: V(26, 2, 20), look: V(0, 4, 0), n: 'Substrate concentration', s: 'Add more substrate. At first the rate rises because collisions are more frequent; then it levels off when the active site is busy almost all the time.', h: 'With many enzyme molecules, the plateau is reached when every active site is occupied: enzyme concentration becomes the limiting factor.', cs: 'C1.1.8, C1.1.9', ch: '' },
        { at: V(14, -4, 26), look: V(4, 0, 0), n: 'Inhibitors (HL)', s: 'Some chemicals slow enzymes down. Switch the level to HL to add inhibitors in the panel.', h: 'A competitive inhibitor (red) has a similar shape to the substrate and blocks the active site; adding more substrate overcomes it. A non-competitive inhibitor binds at an allosteric site and changes the active site shape; more substrate does not help.', cs: 'C1.1.8', ch: 'C1.1.14, C1.1.15' }
      ],
      side: '<h3>Controls</h3><label style="display:block">Temperature <b id="e-tv">37 °C</b><input id="e-temp" type="range" min="0" max="80" value="37" style="width:100%"></label><label style="display:block">pH <b id="e-pv">pH 7</b><input id="e-ph" type="range" min="1" max="13" value="7" style="width:100%"></label><label style="display:block">Substrate <b id="e-cv">20 molecules</b><input id="e-conc" type="range" min="2" max="40" value="20" style="width:100%"></label><label style="display:block">Inhibitor (HL) <select id="e-inh"><option value="none">None</option><option value="comp">Competitive</option><option value="non">Non-competitive</option></select></label><button type="button" id="e-reset" style="margin-top:6px;background:rgba(255,255,255,.12)">Reset enzyme</button><canvas id="e-graph" width="540" height="160" style="display:block;width:100%;height:80px;margin-top:6px"></canvas><p style="margin:2px 0 0">Rate: products per 10 s <b id="e-rate">0</b></p>',
      update(dt, A) { if (!wired) wire(); const run = A.paused ? 0 : dt;
        if (temp > 45) denat = Math.min(1, denat + run * (temp - 45) * 0.01); if (pH < 3 || pH > 11) denat = Math.min(1, denat + run * 0.08);
        const pos = body.geometry.attributes.position; for (let i = 0; i < pos.count; i++) { const x = base[i * 3], y = base[i * 3 + 1], z = base[i * 3 + 2]; const w = 1 + denat * 0.25 * Math.sin(x * 0.9 + y * 0.7) * Math.cos(z * 0.8); pos.setXYZ(i, x * w, y * w, z * w); } pos.needsUpdate = true;
        site.scale.set(1 + denat * 0.8, 1 - denat * 0.6, 1 + denat * 0.3); site.rotation.z = denat * 0.6;
        const phFit = Math.exp(-Math.pow(pH - 7, 2) / 4.5), fit = (1 - denat) * phFit * (inhib === 'non' ? 0.25 : 1);
        const speed = 3 + temp * 0.25; const siteW = V(0, 7.5, 0);
        S.forEach(s => { if (s.bound > 0) { s.bound -= run; s.m.position.copy(siteW); if (s.bound <= 0) { if (s.kind === 'sub') { s.kind = 'prod'; s.m.geometry = new THREE.SphereGeometry(0.9, 12, 8); s.m.material = prodM; made++; s.life = 8; } s.v = V(A.rnd(-1, 1), 1, A.rnd(-1, 1)).normalize(); s.p.copy(siteW).add(V(0, 3, 0)); bound = null; } return; }
          s.p.addScaledVector(s.v, run * speed); s.v.add(A.onSphere(run * 2)).normalize();
          ['x', 'y', 'z'].forEach((ax, i) => { const lim = [34, 24, 24][i]; if (Math.abs(s.p[ax]) > lim) { s.v[ax] *= -1; s.p[ax] = Math.sign(s.p[ax]) * lim; } });
          if (s.p.length() < 9) { s.p.setLength(9); s.v.reflect(s.p.clone().normalize()); }
          if (!bound && s.kind !== 'prod' && s.p.distanceTo(siteW) < 3.2) { const ok = s.kind === 'inh' ? inhib === 'comp' : Math.random() < fit; if (ok) { bound = s; s.bound = s.kind === 'inh' ? 4 : 0.6; } }
          if (s.kind === 'prod') { s.life -= run; if (s.life <= 0) { s.kind = 'sub'; s.m.geometry = subGeo; s.m.material = subM; } }
          s.m.position.copy(s.p); s.m.lookAt(s.p.clone().add(s.v)); });
        tAcc += run; if (tAcc > 1) { tAcc = 0; rateHist.push(made); if (rateHist.length > 60) rateHist.shift(); }

const hero=W.hero||new THREE.Mesh(new THREE.SphereGeometry(1,16,12),api.M(0xffd166,{emissive:0x442200})); if(!W.hero) scene.add(hero);

  if(view==='out'){ const o=W.outsideInfo||{n:'Outside view',s:'Drag to turn the model and scroll to zoom.'};
    info.scrollTop=0; info.innerHTML='<div class="eyebrow">Outside view</div><h2></h2><div class="body"></div>'+(o.cs?'<div class="codes"></div>':'')+'<div class="nav"><button type="button" class="go" id="n-ride"></button></div>';
    info.querySelector('h2').textContent=o.n; fillBody(info,o); if(o.cs) info.querySelector('.codes').textContent='Syllabus: '+o.cs+(level==='hl'&&o.ch?', '+o.ch:'');
    $('n-ride').textContent=J.rideLabel||'Ride'; $('n-ride').onclick=()=>setView('ride'); diveButtons(W.dives||[],info.querySelector('.nav')); if(W.onView) W.onView('out'); return; }
  const s=VIS[stop]; info.scrollTop=0; info.innerHTML='<div class="eyebrow"></div><h2></h2><div class="body"></div><div class="codes"></div><div class="nav"><button type="button" id="n-prev">Back</button><button type="button" class="go" id="n-next"></button></div>';
  info.querySelector('.eyebrow').textContent='Stop '+(stop+1)+' of '+VIS.length+(s.hl?' · HL stop':''); info.querySelector('h2').textContent=s.n;
  fillBody(info,s); info.querySelector('.codes').textContent='Syllabus: '+[s.cs,level==='hl'?s.ch:''].filter(Boolean).join(', ');
  const nx=$('n-next'); nx.textContent=stop===VIS.length-1?'Start again':'Next stop'; $('n-prev').onclick=()=>go(-1); nx.onclick=()=>go(1); diveButtons(dives(s),info.querySelector('.nav'));

function go(d){ if(dive){ dGo(d); return; } if(view!=='ride') return; stop+=d; if(stop>=VIS.length){ stop=0; u=VIS[0].u; } if(stop<0) stop=0; uTarget=VIS[stop].u; yawOff=0; pitchOff=0; showStop(); }
api.goStop=i=>{ setView('ride'); const t=STOPS.find(s=>s._i===i)||STOPS[Math.max(0,Math.min(STOPS.length-1,i))]; let k=VIS.indexOf(t); if(k<0) k=Math.max(0,VIS.filter(x=>x._i<t._i).length-1); stop=k; uTarget=VIS[stop].u; yawOff=0; pitchOff=0; showStop(); };
function setView(v){ if(dive) leaveDive(); view=v; $('v-ride').setAttribute('aria-pressed',v==='ride'); $('v-out').setAttribute('aria-pressed',v==='out'); scene.fog.density=v==='out'?(J.fog||0.006)*0.3:(J.fog||0.006); showStop(); }
function setLevel(l){ const cur=VIS[stop]; level=l; VIS=STOPS.filter(forLevel); let k=VIS.indexOf(cur); if(k<0) k=Math.max(0,VIS.filter(x=>x._i<cur._i).length-1); stop=k; uTarget=VIS[stop].u; try{ localStorage.setItem('wtc-cell-level',l); }catch(e){} $('l-sl').setAttribute('aria-pressed',l==='sl'); $('l-hl').setAttribute('aria-pressed',l==='hl'); showStop(); }
function togglePause(){ api.paused=!api.paused; $('b-pause').setAttribute('aria-pressed',api.paused); $('b-pause').textContent=api.paused?'Play':'Pause'; }
$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
$('b-pause').onclick=togglePause; $('b-help').onclick=()=>{ $('start').hidden=false; }; $('b-start').onclick=()=>{ $('start').hidden=true; canvas.focus(); };
window.addEventListener('keydown',e=>{ if(!$('start').hidden) return; if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); go(1); } else if(e.code==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.code==='KeyP') togglePause(); else if(e.code==='Escape'&&dive) closeDive(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};
  if(dive){ dYaw-=dx*0.006; dPitch=Math.max(-1.35,Math.min(1.35,dPitch+dy*0.006)); }
  else if(view==='ride'){ yawOff-=dx*0.004; pitchOff=Math.max(-1.2,Math.min(1.2,pitchOff-dy*0.004)); } else { oy-=dx*0.006; op=Math.max(-1.3,Math.min(1.3,op+dy*0.006)); } });
canvas.addEventListener('pointerup',()=>{ drag=null; });
canvas.addEventListener('wheel',e=>{ if(dive){ e.preventDefault(); const base=DS()[dStep].dist||dive.dist||60; dDistGoal=Math.max(base*0.3,Math.min(base*2.5,dDistGoal+e.deltaY*0.05)); return; } if(view==='out'){ e.preventDefault(); od=Math.max(out.dist*0.4,Math.min(out.dist*2,od+e.deltaY*0.1)); } },{passive:false});
let sizeW=0,sizeH=0;
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; sizeW=w; sizeH=h; renderer.setSize(w,h,false); camera.aspect=w/h; dCam.aspect=w/h; shiftView(); }
// On wide screens, centre the picture in the space right of the text panel (2026-11-18).
let shiftPx=-1;
function shiftView(){ const w=canvas.clientWidth; if(!w) return; const px=w>=900?243:0; shiftPx=px;
  [camera,dCam].forEach(c=>{ c.filmOffset=-(px/w)*c.getFilmWidth()*2*Math.tan(c.fov*Math.PI/360)*c.aspect; c.updateProjectionMatrix(); }); }
window.addEventListener('resize',resize);
const v=new THREE.Vector3(); let last=performance.now();
function step(now){ if(canvas.clientWidth!==sizeW||canvas.clientHeight!==sizeH) resize(); const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=now; if(!api.paused) api.t+=dt;
  const du=uTarget-u; u+=du*Math.min(1,dt*(reduceMotion?20:1.5)); if(Math.abs(du)<0.0004) u=uTarget;
  hero.position.copy(route.getPointAt(Math.min(0.999,Math.max(0,u))));
  if(dive){ if(dive.ctl.update) dive.ctl.update(dt,dive.api,dStep); dTarget.lerp(dTargetGoal,Math.min(1,dt*3)); dDist+=(dDistGoal-dDist)*Math.min(1,dt*3);
    dCam.position.set(dTarget.x+Math.sin(dYaw)*Math.cos(dPitch)*dDist, dTarget.y+Math.sin(dPitch)*dDist, dTarget.z+Math.cos(dYaw)*Math.cos(dPitch)*dDist); dCam.lookAt(dTarget);
    const w=canvas.clientWidth,h=canvas.clientHeight;
    labels.forEach(l=>{ if(l.dv!==dive){ l.el.style.display='none'; return; } v.copy(l.pos).applyMatrix4(dive.group.matrixWorld).project(dCam); const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05&&l.el.dataset.off!=='1';
      if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=0.95; } else l.el.style.display='none'; });
    renderer.render(diveScene,dCam); return; }
  if(W.update) W.update(dt,api); anims.forEach(f=>f(dt,api));
  if(view==='ride'){ const ahead=route.getPointAt(Math.min(0.999,u+0.02)), behind=route.getPointAt(Math.max(0,u-0.03));
    camera.position.copy(behind); if(W.settle){ const nr=Math.max(0,1-Math.abs(uTarget-u)/0.05); camera.position.lerp(route.getPointAt(Math.min(0.999,Math.max(0,u))),nr); } camera.position.add(camOff); let d=ahead.clone().sub(camera.position).normalize();
    const lk=VIS[stop].look; if(lk){ const near=Math.max(0.7,1-Math.abs(uTarget-u)/0.03); d.lerp(lk.clone().sub(camera.position).normalize(),near).normalize(); }
    camera.rotation.set(Math.asin(Math.max(-1,Math.min(1,d.y)))+pitchOff, Math.atan2(-d.x,-d.z)+yawOff, 0); }
  else { camera.position.set(out.target.x+Math.sin(oy)*Math.cos(op)*od, out.target.y+Math.sin(op)*od, out.target.z+Math.cos(oy)*Math.cos(op)*od); camera.lookAt(out.target); }
  const w=canvas.clientWidth,h=canvas.clientHeight;
  labels.forEach(l=>{ if(l.dv||l.el.dataset.off==='1'){ l.el.style.display='none'; return; } v.copy(l.pos).project(camera); const d=camera.position.distanceTo(l.pos); const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05&&(view==='out'||d<l.far);
    if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=view==='out'?0.95:Math.max(0.3,1.2-d/l.far); } else l.el.style.display='none'; });
  renderer.render(scene,camera); }
// Adaptive quality (2026-11-17): if frames are slow on a weak graphics chip, draw fewer pixels so the animation stays smooth.
let qN=0, qT=0, qLast=0, qLevel=0; const qRatios=[Math.min(window.devicePixelRatio||1,1.5),1,0.75,0.6];
let loopErrs=0; function loopErr(e){ loopErrs++; if(loopErrs<4) console.error(e); if(loopErrs===60&&window.wtcNotice) wtcNotice("Something keeps going wrong in the animation.","Details for your teacher: "+e.message); }

if(W.side) api.side(W.side);
setLevel(level); resize(); requestAnimationFrame(frame);
{ const m=/^#zoom-(\d+)$/.exec(location.hash); if(m&&W.dives&&W.dives[+m[1]]){ $('start').hidden=true; openDive(W.dives[+m[1]]); } }
window.journeyDebug={openDive, go, quality:()=>({level:qLevel, ratio:qRatios[qLevel], calls:renderer.info.render.calls, triangles:renderer.info.render.triangles}), tick:n=>{ for(let i=0;i<n;i++){ last-=33; step(last+33); } }, dives:()=>W.dives, stops:STOPS};
})();
