<script>
window.JOURNEY = {
  title: 'How a Protein Folds',
  sub: 'DP Biology B1.2 · simplified, not to scale',
  startTitle: 'From a chain to a working shape',
  intro: 'Fly along a protein as it is built and folded: amino acids joined by condensation, helices and pleated sheets, a folded globular protein, haemoglobin made of four chains, fibrous collagen, and a protein losing its shape when heated.',
  note: 'Bead colours show the R-group: yellow non-polar (hydrophobic), green polar, blue positively charged, red negatively charged. Thin white lines: hydrogen bonds. Orange link: a disulfide bond.',
  rideLabel: 'Follow the chain',
  theme: { bg: '#0f1418', panel: 'rgba(14,22,28,.86)', accent: '#f9c74f', dim: '#cdd6dc', line: 'rgba(230,220,180,.22)' },
  fog: 0.005,
  build(A) {
    const { V, M, T, tube, scene, THREE } = A;
    const RC = [0xf9c74f, 0x52b788, 0x4895ef, 0xe63946];
    const ballG = new THREE.SphereGeometry(1, 12, 10);
    function beads(pts, colorOf, r) { const im = new THREE.InstancedMesh(ballG, new THREE.MeshStandardMaterial({ roughness: 0.45 }), pts.length); const d = new THREE.Object3D(), c = new THREE.Color();
      pts.forEach((p, i) => { d.position.copy(p); d.scale.setScalar(r || 0.55); d.updateMatrix(); im.setMatrixAt(i, d.matrix); im.setColorAt(i, c.setHex(colorOf(i, p))); }); scene.add(im); return im; }
    function chain(pts, col, r) { scene.add(tube(pts, r || 0.18, M(col || 0xd9d9d9), Math.max(20, pts.length * 4))); }
    const hb = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
    function lines(pairs, mat) { const g = new THREE.BufferGeometry().setFromPoints(pairs.flat()); scene.add(new THREE.LineSegments(g, mat || hb)); }
    const pat = [0, 1, 0, 2, 1, 0, 3, 0, 1, 1, 0, 2, 0, 3, 1, 0, 0, 2, 1, 3];
    // 1. Primary structure with condensation
    const prim = []; for (let i = 0; i < 18; i++) prim.push(V(-74 + i * 1.5, Math.sin(i * 0.7) * 0.6, 0));
    chain(prim); beads(prim, i => RC[pat[i % 20]]);
    const newAA = new THREE.Mesh(ballG, M(RC[2])); newAA.scale.setScalar(0.55); scene.add(newAA);
    const water = new THREE.Mesh(ballG, M(0x4fb3ff, { emissive: 0x113355 })); water.scale.setScalar(0.4); scene.add(water);
    // 2. Secondary structure: alpha helix and beta pleated sheet
    const hel = []; for (let i = 0; i < 22; i++) { const a = i * 2 * Math.PI / 3.6; hel.push(V(-42 + i * 0.55, 6 + Math.cos(a) * 1.9, Math.sin(a) * 1.9)); }
    chain(hel, 0xe9c46a); beads(hel, i => RC[pat[i % 20]], 0.45); lines(hel.slice(0, -4).map((p, i) => [p, hel[i + 4]]));
    const sheet = []; const strands = [];
    for (let s = 0; s < 3; s++) { const st = []; for (let i = 0; i < 9; i++) { const x = -42 + (s % 2 ? 8 - i : i) * 1.4; st.push(V(x, -6 + (i % 2 ? 0.45 : -0.45), s * 2.4)); } strands.push(st); sheet.push(...st); }
    chain(sheet, 0x90be6d); beads(sheet, i => RC[pat[(i * 3) % 20]], 0.45);
    const sp = []; for (let s = 0; s < 2; s++) for (let i = 0; i < 9; i += 2) sp.push([strands[s][i], strands[s + 1][8 - i]]); lines(sp);
    // 3. Tertiary structure: a folded globule, non-polar inside
    function glob(cx, n, R, seed) { let s = Math.floor(seed * 1000) + 7; const rn = () => { s = (s * 16807) % 2147483647; return s / 2147483647 - 0.5; };
      const pts = []; let p = cx.clone().add(V(-R * 0.6, 0, 0)), dir = V(1, 0, 0);
      for (let i = 0; i < n; i++) { dir.add(V(rn(), rn(), rn()).multiplyScalar(1.4)).normalize(); let nx = p.clone().add(dir.clone().multiplyScalar(1.15));
        if (nx.distanceTo(cx) > R) { dir.add(cx.clone().sub(nx).normalize().multiplyScalar(1.6)).normalize(); nx = p.clone().add(dir.clone().multiplyScalar(1.15)); }
        pts.push(nx); p = nx; } return pts; }
    const tc = V(0, 0, 0), ter = glob(tc, 70, 6.5, 0.3);
    chain(ter, 0xbdbdbd, 0.16); beads(ter, (i, p) => p.distanceTo(tc) < 4.2 ? RC[0] : RC[1 + (i % 3)], 0.6);
    const ss = [ter[12], ter[47]]; scene.add(tube([ss[0], ss[0].clone().lerp(ss[1], 0.5).add(V(0, 0.5, 0)), ss[1]], 0.22, M(0xff9f1c, { emissive: 0x552200 }), 12));
    // 4. Quaternary: haemoglobin, four chains each with a haem group
    const hc = V(34, 0, 0), sub = [V(-3.4, 2.6, 2), V(3.4, 2.6, -2), V(-3.4, -2.6, -2), V(3.4, -2.6, 2)];
    sub.forEach((o, k) => { const c = hc.clone().add(o), pts = glob(c, 46, 3.8, k * 1.3); chain(pts, k % 2 ? 0xff8fab : 0xe63946, 0.22); beads(pts, (i, p) => k % 2 ? 0xffb3c6 : 0xef6f6c, 0.45);
      const haem = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.25, 6), M(0x6a040f, { emissive: 0x330000 })); haem.position.copy(c).add(o.clone().multiplyScalar(0.35)); haem.lookAt(hc); haem.rotateX(Math.PI / 2); scene.add(haem);
      const fe = new THREE.Mesh(ballG, M(0xffd166, { emissive: 0x553300 })); fe.scale.setScalar(0.35); fe.position.copy(haem.position); scene.add(fe); });
    // 5. Collagen: three chains wound into a rope
    for (let k = 0; k < 3; k++) { const pts = []; for (let i = 0; i <= 80; i++) { const y = -12 + i * 0.3, a = y * 0.9 + k * 2.094; pts.push(V(60 + Math.cos(a) * 0.9, y, Math.sin(a) * 0.9)); } chain(pts, [0xf4a261, 0xe9c46a, 0xf6bd60][k], 0.45); }
    // 6. Denaturation: a protein unfolding and refolding as it is heated (shown on a loop)
    const dc = V(84, 0, 0), dn = 50, fold = glob(dc, dn, 5, 2.2), open = []; for (let i = 0; i < dn; i++) open.push(V(dc.x - 14 + i * 0.58, Math.sin(i * 0.5) * 2.5 + A.rnd(-0.6, 0.6), Math.cos(i * 0.37) * 2.5));
    const dIm = new THREE.InstancedMesh(ballG, new THREE.MeshStandardMaterial({ roughness: 0.45 }), dn); { const c = new THREE.Color(); for (let i = 0; i < dn; i++) dIm.setColorAt(i, c.setHex(fold[i].distanceTo(dc) < 3.2 ? RC[0] : RC[1 + (i % 3)])); } scene.add(dIm);
    const dLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(fold), new THREE.LineBasicMaterial({ color: 0xcccccc })); dLine.frustumCulled = false; scene.add(dLine);
    const flame = new THREE.Mesh(new THREE.ConeGeometry(2, 5, 16), M(0xff6d00, { emissive: 0xff3d00, transparent: true, opacity: 0.8 })); flame.position.set(84, -11, 0); scene.add(flame);
    A.label('Primary structure', V(-62, 4, 0)); A.label('Peptide bond made by condensation', V(-48, -3, 0)); A.label('Alpha helix', V(-36, 10.5, 0)); A.label('Beta pleated sheet', V(-36, -9.5, 2)); A.label('Tertiary structure', V(0, 9, 0)); A.label('Disulfide bond', ss[0].clone().add(V(0, 1.5, 0)));
    A.label('Haemoglobin: quaternary', V(34, 9, 0)); A.label('Haem group', hc.clone().add(V(0, 0, 3))); A.label('Collagen: a fibrous protein', V(60, 14, 0)); A.label('Denaturation', V(84, 10, 0));
    const hero = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), M(0xffffff)); hero.visible = false; scene.add(hero);
    const d = new THREE.Object3D(), tmp = [];
    return {
      route: [V(-90, 14, 40), V(-60, 6, 22), V(-36, 2, 22), V(0, 4, 24), V(34, 4, 26), V(60, 2, 24), V(84, 4, 30)], hero, camOffset: V(0, 0, 0), outside: { target: V(5, 0, 0), dist: 170 },
      outsideInfo: { n: 'Four levels of protein structure', s: 'A protein is a chain of amino acids that folds into a precise shape. Its shape decides what it can do.', h: 'Primary structure is the sequence; secondary structure is local helices and sheets held by hydrogen bonds; tertiary structure is the whole fold held by bonds between R-groups; quaternary structure is several chains working together.', cs: 'B1.2.1', ch: 'B1.2.7, B1.2.8, B1.2.9, B1.2.11' },
      stops: [
        { at: V(-60, 6, 22), look: V(-58, 0, 0), n: 'Amino acids join into a chain', s: 'Every amino acid has the same backbone and a different R-group (shown by colour). A condensation reaction joins two amino acids with a peptide bond and releases a water molecule (blue).', h: 'The order of amino acids is the primary structure, set by the base sequence of a gene. With 20 amino acids, a chain of n amino acids has 20^n possible sequences.', cs: 'B1.2.1, B1.2.2, B1.2.4', ch: 'B1.2.7' },
        { at: V(-36, 2, 22), look: V(-38, 0, 0), n: 'Helices and pleated sheets', s: 'Parts of the chain coil into helices or lie side by side as pleated sheets.', h: 'This secondary structure is held by hydrogen bonds between the backbone C=O and N–H groups (white lines): in a helix between amino acids four apart, in a sheet between neighbouring strands.', cs: 'B1.2.6', ch: 'B1.2.8' },
        { at: V(0, 4, 24), look: tc, n: 'Folding into a 3D shape', s: 'The chain folds into a compact, precise shape. The sequence of amino acids decides how it folds, and the shape decides the job the protein can do.', h: 'Tertiary structure is held by hydrogen bonds, ionic bonds and disulfide bonds (orange) between R-groups, and by hydrophobic interactions: non-polar R-groups (yellow) cluster inside, away from water, while polar ones face out.', cs: 'B1.2.6', ch: 'B1.2.9, B1.2.10' },
        { at: V(34, 4, 26), look: hc, n: 'Haemoglobin: four chains', s: 'Some proteins are made of more than one chain. Haemoglobin has four, each holding a haem group with iron that binds oxygen.', h: 'This is quaternary structure. Haemoglobin is a conjugated protein because it includes non-protein haem groups; it is globular, so it is soluble in blood plasma.', cs: 'B1.2.6', ch: 'B1.2.11, B1.2.12' },
        { at: V(60, 2, 24), look: V(60, 0, 0), n: 'Collagen: a fibrous protein', s: 'Collagen is long and rope-like, made of three chains wound together. It gives strength to skin, tendons and bone.', h: 'Fibrous proteins have repeating sequences and long, narrow shapes, so they are strong and insoluble. Globular proteins such as enzymes and haemoglobin are rounded and soluble.', cs: 'B1.2.6', ch: 'B1.2.12' },
        { at: V(84, 4, 30), look: dc, n: 'Denaturation', s: 'High temperature or extreme pH breaks the bonds holding the shape, so the protein unfolds and stops working. This is usually permanent.', h: 'Heat makes the chain vibrate until weak bonds break; a change in pH alters the charges on R-groups, breaking ionic and hydrogen bonds. The primary structure is not broken.', cs: 'B1.2.5', ch: '' }
      ],
      update(dt, A) { const t = A.t;
        const c = (t * 0.3) % 1, end = prim[prim.length - 1]; newAA.position.copy(end).add(V(1.5 + 2.5 * (1 - Math.min(1, c * 2)), 2.5 * (1 - Math.min(1, c * 2)), 0)); water.visible = c > 0.5; water.position.copy(end).add(V(1, -1 - (c - 0.5) * 8, 1));
        const k = (Math.sin(t * 0.6) + 1) / 2, h = k * k * (3 - 2 * k); flame.material.opacity = 0.2 + 0.7 * h; flame.scale.setScalar(0.6 + 0.4 * h);
        for (let i = 0; i < dn; i++) { const p = fold[i].clone().lerp(open[i], h); tmp[i] = p; d.position.copy(p); d.scale.setScalar(0.55); d.updateMatrix(); dIm.setMatrixAt(i, d.matrix); }
        dIm.instanceMatrix.needsUpdate = true; dLine.geometry.setFromPoints(tmp);
      }
    };
  }
};

</script>
<script>
/* What the Cell walk-through engine (2026-11-16). A page supplies window.JOURNEY = {title, sub, intro, note, theme,
   rideLabel, build(api)}; build returns {route:[Vector3...], stops:[{at,n,s,h,cs,ch}], outside:{target,dist},
   hero (mesh, optional), camOffset (Vector3), update(dt, api), side (html, optional), fog}.
   Stops: s = SL text, h = extra HL text, cs = SL codes, ch = extra HL codes. */
(function(){
'use strict';
const J=window.JOURNEY; const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const th=J.theme||{}; Object.keys(th).forEach(k=>document.documentElement.style.setProperty('--'+k,th[k]));
$('t-title').textContent=J.title; $('t-sub').textContent=J.sub||''; $('s-title').textContent=J.startTitle||J.title; $('s-intro').textContent=J.intro||''; $('s-note').textContent=J.note||'';
$('v-ride').textContent=J.rideLabel||'Ride'; $('c').setAttribute('aria-label',J.title+': 3D model. Use the arrow keys or the Next button to move between stops.');
let level='sl'; try{ if(localStorage.getItem('wtc-cell-level')==='hl') level='hl'; }catch(e){}
const canvas=$('c'); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const bg=new THREE.Color(th.bg||'#0b1a2a'); renderer.setClearColor(bg);
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(bg,J.fog||0.006);
const camera=new THREE.PerspectiveCamera(65,1,0.1,900); camera.rotation.order='YXZ'; scene.add(camera);
scene.add(new THREE.HemisphereLight(0xf2f6ff,0x20202a,0.9)); camera.add(new THREE.PointLight(0xffffff,0.55,160));
const sun=new THREE.DirectionalLight(0xffffff,0.5); sun.position.set(40,70,80); scene.add(sun);
const labels=[], anims=[];
const api={THREE, scene, camera, reduceMotion, paused:false, t:0,
  V:(x,y,z)=>new THREE.Vector3(x,y,z),
  M:(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.55,metalness:0.05},o||{})),
  T:(c,op,side)=>new THREE.MeshStandardMaterial({color:c,roughness:0.55,metalness:0.05,transparent:true,opacity:op,side:side||THREE.DoubleSide,depthWrite:false}),
  tube:(pts,r,mat,seg,closed)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,!!closed),seg||64,r,14,!!closed),mat),
  label:(text,pos,far)=>{ const el=document.createElement('div'); el.className='lab'; el.textContent=text; $('labels').appendChild(el); labels.push({el,pos,far:far||70}); },
  anim:fn=>anims.push(fn), level:()=>level, rnd:(a,b)=>a+Math.random()*(b-a),
  onSphere:r=>{ const u=Math.random()*2-1, a=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u); return new THREE.Vector3(r*s*Math.cos(a),r*u,r*s*Math.sin(a)); },
  side:html=>{ $('side').innerHTML=html; $('side').hidden=!html; }, button:(id,label,fn)=>{ const b=document.createElement('button'); b.type='button'; b.id=id; b.textContent=label; b.setAttribute('aria-pressed','false'); b.onclick=()=>fn(b); $('extra').prepend(b); return b; },
  refresh:()=>showStop() };
const W=J.build(api);
const route=new THREE.CatmullRomCurve3(W.route,false,'catmullrom',0.3);
function nearestU(p){ let best=0,bd=1e9; for(let i=0;i<=800;i++){ const u=i/800, d=route.getPointAt(u).distanceTo(p); if(d<bd){ bd=d; best=u; } } return best; }
const STOPS=W.stops.map(s=>Object.assign(s,{u:s.u!=null?s.u:nearestU(s.at)}));
const hero=W.hero||new THREE.Mesh(new THREE.SphereGeometry(1,16,12),api.M(0xffd166,{emissive:0x442200})); if(!W.hero) scene.add(hero);
const camOff=W.camOffset||api.V(0,3,5);
let view='ride', stop=0, u=STOPS[0].u, uTarget=u, yawOff=0, pitchOff=0; const out=W.outside||{target:api.V(0,0,0),dist:150}; let oy=0.5, op=0.2, od=out.dist;
api.u=()=>u; api.route=route; api.stop=()=>stop; api.view=()=>view;
function showStop(){ const info=$('info');
  if(view==='out'){ const o=W.outsideInfo||{n:'Outside view',s:'Drag to turn the model and scroll to zoom.'};
    info.innerHTML='<div class="eyebrow">Outside view</div><h2></h2><p></p>'+(o.cs?'<div class="codes"></div>':'')+'<div class="nav"><button type="button" class="go" id="n-ride"></button></div>';
    info.querySelector('h2').textContent=o.n; info.querySelector('p').textContent=o.s+(level==='hl'&&o.h?' '+o.h:''); if(o.cs) info.querySelector('.codes').textContent='Syllabus: '+o.cs+(level==='hl'&&o.ch?', '+o.ch:'');
    $('n-ride').textContent=J.rideLabel||'Ride'; $('n-ride').onclick=()=>setView('ride'); if(W.onView) W.onView('out'); return; }
  const s=STOPS[stop]; info.innerHTML='<div class="eyebrow"></div><h2></h2><p></p><div class="codes"></div><div class="nav"><button type="button" id="n-prev">Back</button><button type="button" class="go" id="n-next"></button></div>';
  info.querySelector('.eyebrow').textContent='Stop '+(stop+1)+' of '+STOPS.length; info.querySelector('h2').textContent=s.n;
  info.querySelector('p').textContent=s.s+(level==='hl'&&s.h?' '+s.h:''); info.querySelector('.codes').textContent='Syllabus: '+s.cs+(level==='hl'&&s.ch?', '+s.ch:'');
  const nx=$('n-next'); nx.textContent=stop===STOPS.length-1?'Start again':'Next stop'; $('n-prev').onclick=()=>go(-1); nx.onclick=()=>go(1);
  if(W.onStop) W.onStop(stop, s); if(W.onView) W.onView('ride'); }
function go(d){ if(view!=='ride') return; stop+=d; if(stop>=STOPS.length){ stop=0; u=STOPS[0].u; } if(stop<0) stop=0; uTarget=STOPS[stop].u; yawOff=0; pitchOff=0; showStop(); }
function setView(v){ view=v; $('v-ride').setAttribute('aria-pressed',v==='ride'); $('v-out').setAttribute('aria-pressed',v==='out'); scene.fog.density=v==='out'?(J.fog||0.006)*0.3:(J.fog||0.006); showStop(); }
function setLevel(l){ level=l; try{ localStorage.setItem('wtc-cell-level',l); }catch(e){} $('l-sl').setAttribute('aria-pressed',l==='sl'); $('l-hl').setAttribute('aria-pressed',l==='hl'); showStop(); }
function togglePause(){ api.paused=!api.paused; $('b-pause').setAttribute('aria-pressed',api.paused); $('b-pause').textContent=api.paused?'Play':'Pause'; }
$('v-ride').onclick=()=>setView('ride'); $('v-out').onclick=()=>setView('out'); $('l-sl').onclick=()=>setLevel('sl'); $('l-hl').onclick=()=>setLevel('hl');
$('b-pause').onclick=togglePause; $('b-help').onclick=()=>{ $('start').hidden=false; }; $('b-start').onclick=()=>{ $('start').hidden=true; canvas.focus(); };
window.addEventListener('keydown',e=>{ if(!$('start').hidden) return; if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); go(1); } else if(e.code==='ArrowLeft'){ e.preventDefault(); go(-1); } else if(e.code==='KeyP') togglePause(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};
  if(view==='ride'){ yawOff-=dx*0.004; pitchOff=Math.max(-1.2,Math.min(1.2,pitchOff-dy*0.004)); } else { oy-=dx*0.006; op=Math.max(-1.3,Math.min(1.3,op+dy*0.006)); } });
canvas.addEventListener('pointerup',()=>{ drag=null; });
canvas.addEventListener('wheel',e=>{ if(view==='out'){ e.preventDefault(); od=Math.max(out.dist*0.4,Math.min(out.dist*2,od+e.deltaY*0.1)); } },{passive:false});
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
const v=new THREE.Vector3(); let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if(!api.paused) api.t+=dt;
  const du=uTarget-u; u+=du*Math.min(1,dt*(reduceMotion?20:1.5)); if(Math.abs(du)<0.0004) u=uTarget;
  hero.position.copy(route.getPointAt(Math.min(0.999,Math.max(0,u))));
  if(W.update) W.update(dt,api); anims.forEach(f=>f(dt,api));
  if(view==='ride'){ const ahead=route.getPointAt(Math.min(0.999,u+0.02)), behind=route.getPointAt(Math.max(0,u-0.03));
    camera.position.copy(behind).add(camOff); let d=ahead.clone().sub(camera.position).normalize();
    const lk=STOPS[stop].look; if(lk){ const near=Math.max(0,1-Math.abs(uTarget-u)/0.03); if(near>0) d.lerp(lk.clone().sub(camera.position).normalize(),near).normalize(); }
    camera.rotation.set(Math.asin(Math.max(-1,Math.min(1,d.y)))+pitchOff, Math.atan2(-d.x,-d.z)+yawOff, 0); }
  else { if(!drag&&!reduceMotion) oy+=dt*0.12; camera.position.set(out.target.x+Math.sin(oy)*Math.cos(op)*od, out.target.y+Math.sin(op)*od, out.target.z+Math.cos(oy)*Math.cos(op)*od); camera.lookAt(out.target); }
  const w=canvas.clientWidth,h=canvas.clientHeight;
  labels.forEach(l=>{ v.copy(l.pos).project(camera); const d=camera.position.distanceTo(l.pos); const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05&&(view==='out'||d<l.far);
    if(vis){ l.el.style.display=''; l.el.style.left=((v.x+1)/2*w)+'px'; l.el.style.top=((1-v.y)/2*h)+'px'; l.el.style.opacity=view==='out'?0.95:Math.max(0.3,1.2-d/l.far); } else l.el.style.display='none'; });
  renderer.render(scene,camera); requestAnimationFrame(frame); }
if(W.side) api.side(W.side);
setLevel(level); resize(); requestAnimationFrame(frame);
})();

</script>
</body>
</html>
